# Per-species OEP-tune grids (spec sec. 4).
#
# Citation tags [oep-tdl-1..6] are AUTHOR-RECALLED, UNVERIFIED and
# resolve to the TO-DOWNLOAD comment block at the end of
# reports_local/latex/references.bib. All numeric values labeled
# "engineering" are calibrated against the codebase's own _OEP_TIERS
# defaults at xcquinox/alec/external_refs.py:393-420; nothing here
# depends on the unverified literature claims.
#
# Schema (per spec sec. 9.3):
#   <species>:
#     charge:        int
#     spin:          int (PySCF 2S = N_alpha - N_beta convention)
#     hypothesis:    free-text dominant-pathology summary
#     target_floor:  float (engineering choice; spec sec. 4 per-species)
#     sweep:         dict of knob -> list of values

Be:
  charge: 0
  spin: 0
  hypothesis: "Wu-Yang basis-set imbalance + 2s/2p MR character [oep-tdl-1, oep-tdl-2 unverified]."
  target_floor: 5.0e-3
  sweep:
    aux_basis: ["def2-svp-jkfit", "def2-tzvp-jkfit", "def2-qzvp-jkfit"]
    regularization: [1.0e-4, 1.0e-3, 1.0e-2]
    grid_level: [1, 2]

"C+":
