  spin: 1
  hypothesis: "UKS basin-hopping among p_x/p_y/p_z singly-occupied [oep-tdl-4, oep-tdl-5 unverified]."
  target_floor: 1.5e-2
  sweep:
    level_shift: [0.5, 0.75, 1.0]
    inner_damp: [0.1, 0.3]
    aux_basis: ["def2-tzvp-jkfit", "def2-qzvp-jkfit"]
    grid_level: [1, 2]

