# Helper file to handle all configs

[coverage:run]
# .coveragerc to control coverage.py and pytest-cov
omit =
    # Omit the tests
    */tests/*
    # Omit generated versioneer
    # xcquinox/_version.py

[yapf]
# YAPF, in .style.yapf files this shows up as "[style]" header
COLUMN_LIMIT = 119
INDENT_WIDTH = 4
USE_TABS = False

[flake8]
# Flake8, PyFlakes, etc
max-line-length = 119

[aliases]
test = pytest

[versioneer]
VCS = git
style = pep440
versionfile_source = xcquinox/_version.py
versionfile_build = xcquinox/_version.py
tag_prefix = ''

[tool:pytest]
markers =
    slow: marks tests as slow (deselect for quick local iteration with '-m "not slow"')
# No default deselection: the ~190 collected slow test items are part of
# the suite and run unless explicitly deselected. The default '-m "not slow"'
# let slow-only pins go stale unnoticed (a validated-full-pool baseline pin
# drifted through a semantics change because nothing ever ran it); pass
# -m "not slow" by hand for a fast iteration loop.