name: CI

on:
  push:
    branches:
      - "main"
      - "alec_dev"
  pull_request:
    branches:
      - "main"
      - "alec_dev"
  schedule:
    # Weekly, on the latest commit of the default branch.
    - cron: "0 0 * * 0"

jobs:
  test:
    name: Test on ${{ matrix.os }}, Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
        # The declared minimum is 3.12, the floor numpy 2.5 and scipy 1.18 carry (pyscfad
        # 0.3.4 and jax 0.10.2 admit 3.11, where no numpy 2.5 exists); tools/test_packaging.py
        # holds it equal to the lowest version run here and to what the installed stack requires.
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Additional info about the build
        run: |
          uname -a
          df -h
          ulimit -a

      - name: Install the package with its declared dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[test]
          python -m pip list

      - name: Raise the memory-mapping ceiling
        # Under jaxlib 0.10.2 one process running the whole fast suite reaches the
        # kernel's vm.max_map_count (65530 on a stock kernel) inside XLA's compiler and
        # aborts; a hosted runner has root, so the ceiling
        # is raised here, where a machine without root runs the suite in chunks instead
        # (python -m tools.run_fast_suite).
        run: |
          sudo sysctl -w vm.max_map_count=262144

      - name: Run the tests
        # The slow items (the end-to-end notebook runs, the long trainings) and the oracle
        # set (the cluster's per-architecture spin-scaling oracles) are deselected here; the
        # workstation's runner deselects the same two.
        run: |
          pytest -v -m "not slow and not oracle" --cov=xcquinox --cov-report=xml --color=yes

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: alecpwills/xcquinox
