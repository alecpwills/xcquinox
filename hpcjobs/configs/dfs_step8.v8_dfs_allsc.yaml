# =============================================================================
# dfs_step8.v8_dfs_allsc.yaml -- CAMPAIGN 1 OF THE v8 PROGRAM, ARM S:
#    every molecule self-consistent from the mixed atomic start.
#
# The four architectures of the program (deep_3x16, deep_attn_3x16,
# deep_geom_3x16, deep_geom_attn_3x16) on the DFS full set (subset size 26,
# the whole set), the full_25 solver, the dpyscf-parity arm's hyperparameters
# as the shared base, and the published cloning protocol for the pretraining
# (footing paper, the sampled-row objective, the paper's schedule, no energy
# term, no validation split, no clip). Twelve cells over the three arms, one
# exclusive node each.
#
# The three arms differ in the seed axis alone:
#   arm P  dfs_step8.v8_dfs_parity.yaml     seed_xc auto, seed_mix_atomic true,
#                                           respect_sc_flag true, nonsc_weight 0.5
#   arm S  this file                        seed_xc auto, seed_mix_atomic true,
#                                           respect_sc_flag false
#   arm A  dfs_step8.v8_dfs_coldstart.yaml  seed_xc minao, seed_mix_atomic false,
#                                           respect_sc_flag false
# The pin in test_cluster_examples.py holds every other value equal.
#
# PRETRAINING IS SHARED. This arm runs first and fits the four clones; its
# certified pretrain/<arch> directories are copied into the other two runs
# before their pretrain arrays start (hold the datagen job and the array,
# copy, release; the pretrain keep-gate accepts a copied directory whose
# certificate names the architecture, the run's identity, the parent, the
# model class and the package version, and carries the digests of the two
# networks on disk). The pretraining data root is new to the program and
# shared by the three arms: the file's identity (the paper footing; the
# coordinates and the gate are network fields, not columns of the file) is
# not the v7 root's, and the generator is idempotent.
#
# The held-out evaluation writes the cold-start pair; the reporting channel
# is eval_holdout_coldstart_val_best. The preflight runs the cold-start
# convergence census over the training species.
# =============================================================================

sweep:
  arch:
    - deep_3x16
    - deep_attn_3x16
    - deep_geom_3x16
    - deep_geom_attn_3x16
  loss: [L5_gradnorm_vxc_step7]
  metric: [jsd]
  subset_size: [26]
  solver: [full_25]

solvers:
  full_25:
    mode: FULL
    max_cycles: 25
    feature_policy: REASSEMBLE
    scf_grad_checkpoint: true
    mixer_name: decaying_linear
    mixer_kwargs: {base: 0.3, floor: 0.3, step_offset: 1}
    scf_loss_use_tail: true
    scf_loss_tail: 10
    scf_loss_weight_power: 2.0
    freeze_on_convergence: false

hyperparams:
  n_steps: 100
  lr_start: 1.0e-4
  lr_end: 1.0e-7
  lr_decay_start: 0.5
  grad_clip: 1.0
  gradnorm_alpha: 1.5
  vxc_weight: 0.01
  density_weight: 0.1
  density_per_electron: true
  pbe_anchor_weight: 0.0
  require_atom_anchors: false
  seed: 42
  weight_decay: 1.0e-6
  val_frac: 0.2
  validate_every: 10
  patience: 5
  early_stop_min_delta: 0.1
  checkpoint_every: 10
  pad_group_to_common_shape: true
  update_scheme: per_molecule
  optimizer: adam_plateau
  plateau_patience: 10
  plateau_factor: 0.1
  # the seed axis of the arm
  seed_mix_atomic: true
  respect_sc_flag: false
  nonsc_weight: 1.0
  channel_weights: {loss_vxc: 0.0, loss_BH76: 0.01, loss_IP13: 0.01}

inputs:
  basis: 6-311++G(3df,2pd)
  grid_level: 3
  density_fit: true
  orientation_lock_strength: 3.0e-5
  # the seed axis of the arm: the rung's parent density (PBE for every
  # architecture here), mixed with the atomic guess per update
  seed_xc: auto
  seed_cache_dir: /gpfs/scratch/awills/seed_cache_scan_6311ppg3df2pd_g3
  subset_ledger_path: /gpfs/projects/FernandezGroup/Alec/xcquinox/notebooks/checkpoints_step7/alpha_on/subset_index_log.json
  external_refs_dir: /gpfs/scratch/awills/external_refs_dfs_6311ppg3df2pd_g3
  benchmark_refs_dir: /gpfs/scratch/awills/external_refs_bench_6311ppg3df2pd_g3
  val_refs_dir: /gpfs/scratch/awills/external_refs_val_6311ppg3df2pd_g3
  output_root: /gpfs/scratch/awills/xcquinox_runs/dfs_step8/v8_dfs_allsc

pretrain:
  # the program's own root: the paper footing and the model block below
  # give the file an identity of its own, shared by the three arms
  data_dir: /gpfs/scratch/awills/pretrain_data_dfs_6311ppg3df2pd_g3_v8
  # the published cloning schedule and objective
  n_steps: 20000
  lr_start: 1.0e-3
  lr_end: 1.0e-5
  lr_decay_start: 0.5
  lr_decay_end: 0.9
  grad_clip: 0
  seed: 42
  loss_weighting: rho_w_sampled
  points_per_system: 800
  sampling_seed: 42
  atoms:
    H: 1
    Li: 1
    C: 2
    N: 3
    O: 2
    F: 1
    Na: 1
  dfs_set: true
  pool_atoms: true
  parent_density: auto
  exchange_footing: paper
  mesh_fraction: 0.3
  energy_term_weight: 0.0
  validation_fraction: 0.0
  validation_seed: 0
  validate_every: 50
  patience: 0

cluster:
  partition: ""
  time: "96:00:00"
  cpus_per_task: 24
  array_throttle: 4
  eval_array_throttle: 4
  max_concurrent_tasks: 8
  max_array_size: 1000
  device: cpu
  oom_retry_partition: extended-96core
  timeout_retry_partition: extended-96core
  timeout_retry_time: "168:00:00"
  conda_env: /gpfs/projects/FernandezGroup/Alec/conda_envs/xcquinox_j0102
  conda_profile: /gpfs/projects/FernandezGroup/Alec/miniconda3/etc/profile.d/conda.sh
  mail_user: alec.wills@stonybrook.edu
  mail_type: BEGIN,END,FAIL
  account: ""
  preflight_time: "12:00:00"
  preflight_compile_smoke: true
  preflight_coldstart_census: true
  eval_time: "12:00:00"
  pretrain_time: "48:00:00"
  pretrain_throttle: 4
  datagen_time: "04:00:00"
  benchmark_refs_time: "24:00:00"

domain_profile: dfs_step7
on_precompute_failure: abort
bh76_mode: barrier_height
ae_as_reactions: true
use_polarized_correlation: true
held_out_strict: true
inline_eval: true
eval_coldstart: true
defer_eval: false

model:
  parent_anchor: false
  descriptor_coordinates: paper
  ueg_gate: x2

fidelity:
  tol_AE: 1.0
  tol_atom: 1.0
  tol_AE_aggregate: mae
  tol_AE_max_backstop: 2.0
  override_reason: null
  enforce: true
