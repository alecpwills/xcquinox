# =============================================================================
# bh76w411_repr.tzvpd_grid2_df.yaml -- train the 8-arch ablation set on the
# BH76+W4-11 JSD representative subsets (r=1..6). Submission B: def2-tzvpd +
# grid_level 2 + DENSITY FITTING (RI). DF makes the larger basis memory-feasible
# pipeline-wide (CCSD-ref gen, pretrain, training, held-out eval).
# =============================================================================
# Identical to bh76w411_repr.svp_grid2.yaml except the basis/grid/DF block. The
# preflight density-fits the CCSD reference generation for the (small,
# ledger-scoped) training-subset species; def2-universal-jkfit is the JK fitting
# basis (def2-tzvpd has no dedicated -jkfit; the universal set covers all def2
# orbital bases). 8 archs x 6 subset_sizes = 48 specs (inline-eval).
# =============================================================================

sweep:
  arch:
    - deep
    - deep_attn
    - deep_dm
    - deep_cusp
    - deep_combined
    - deep_combined_attn
    - deep_notransform
    - deep_notransform_attn
  loss: [L5_gradnorm_vxc_step7]
  metric: [jsd]
  subset_size: [1, 2, 3, 4, 5, 6]
  solver: [full_3]

solvers:
  full_3:
    mode: FULL
    max_cycles: 3
    feature_policy: REASSEMBLE

hyperparams:
  n_steps: 250
  lr_start: 0.01
  lr_end: 0.00001
  lr_decay_start: 0.2
  grad_clip: 1.0
  gradnorm_alpha: 1.5
  vxc_weight: 0.01
  density_weight: 0.1
  pbe_anchor_weight: 0.0
  require_atom_anchors: false
  seed: 42

inputs:
  external_refs_dir: /gpfs/scratch/awills/external_refs_bh76w411_tzvpd
  subset_ledger_path: /gpfs/projects/FernandezGroup/Alec/xcquinox/hpcjobs/ledgers/bh76w411_repr_alpha_on_r1-6.json
  basis: def2-tzvpd
  grid_level: 2
  density_fit: true
  auxbasis: def2-universal-jkfit
  output_root: /gpfs/scratch/awills/xcquinox_runs/bh76w411_repr/tzvpd_grid2_df
  # The pretraining data these campaigns consumed was built at the data
  # generator's own lock, 3e-5, which before 2026-08 was the only lock in play
  # (the harness passed none). Stated here so a re-run rebuilds it at the same
  # Hamiltonian; the program's decision is that a re-run is a LOCKED run. What
  # the historical training SCF ran at -- unlocked -- is recorded in those
  # runs' own metadata, not in this file.
  orientation_lock_strength: 3.0e-5
  # Grid level 2 does not resolve a spatially degenerate free atom's P
  # term whatever the lock is, so a rebuild of this campaign's pretraining
  # rows is not reproducible between processes and the data generator refuses
  # it unless the run says otherwise. Waived deliberately: this is the
  # identity the finished campaign was run at.
  allow_irreproducible_degenerate: true
  irreproducible_degenerate_reason: >-
    historical campaign identity at grid level 2; the finished runs
    consumed pretraining data built here, and the campaign is not re-run at a
    finer grid

pretrain:
  data_dir: /gpfs/scratch/awills/pretrain_data_bh76w411_tzvpd_g2
  n_steps: 2500
  lr_start: 0.01
  lr_end: 0.00001
  lr_decay_start: 0.2
  grad_clip: 1.0
  seed: 42
  loss_weighting: integration

cluster:
  partition: ""
  time: "12:00:00"
  cpus_per_task: 24
  array_throttle: 4
  eval_array_throttle: 4
  max_concurrent_tasks: 8
  max_array_size: 1000
  device: cpu
  conda_env: /gpfs/projects/FernandezGroup/Alec/conda_envs/xcquinox
  conda_profile: /gpfs/projects/FernandezGroup/Alec/miniconda3/etc/profile.d/conda.sh
  mail_user: alec.wills@stonybrook.edu
  mail_type: BEGIN,END,FAIL
  account: ""
  preflight_time: "16:00:00"
  eval_time: "04:00:00"
  pretrain_time: "08:00:00"

domain_profile: bh76w411_step7

on_precompute_failure: abort
bh76_mode: reaction_energy
use_polarized_correlation: true
held_out_strict: true

inline_eval: true
defer_eval: false
