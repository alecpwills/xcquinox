# =============================================================================
# dfs_step7.dfs6311_grid3_v3.yaml -- DFS-paper-parity REFERENCE DATA on the v3
# rung-3.5 arch sweep + full_3 regime.
#
# Same subsets, archs (rung-3.5 replacing the leaky deep_combined/dm), solver
# (full_3), and hyperparameters as `svp_grid2_v3.yaml`, but the REFERENCE DATA is
# set to Dick & Fernandez-Serra (PRB 104, L161109, 2021) parity, per the paper SI
# (SI Sec. II): CCSD reference densities in `6-311++G(3df,2pd)` -- "the same basis
# used for training the functionals" -- on grid level 3 (the paper's smallest
# grid). The single `inputs.basis`/`grid_level` knobs drive BOTH the training SCF
# and every CCSD reference, so this whole run moves to the paper basis/grid.
#
# Degenerate open-shell radicals (OH/CH/NO, X-2-Pi): the paper hacked around these
# (density-loss weight lambda_n x0.01 for CH/OH, an artificial NO spin-quartet,
# symmetrized grids). This run instead uses the repo's ORIENTATION LOCK
# (inputs.orientation_lock_strength) -- a small traceless-quadrupole h_core bias
# applied identically to the CCSD references (training + held-out) AND the
# training/eval SCF, so the reference and the functional lock the SAME degenerate
# component and the density is reproducible.
#
# This sweep now includes DFS-FAITHFUL META-GGA archs (deep_mgga*, deep_rung35_mgga)
# alongside the GGA/rung-3.5 archs, closing the paper's meta-GGA deviations: the
# iso-orbital alpha = (tau - tau_W)/tau_unif input (D2), the tighter 1.174 Lieb-Oxford
# exchange ceiling (D3), DFS's (x2 + tanh^2(x3)) UEG-recovery gate (D4), and SCAN
# pretraining -- meta_gga archs pretrain to SCAN, a GGA cannot fit SCAN's
# alpha-dependence (D5). See alec/metagga.py + networks.py meta_gga.
#
# Remaining documented deviations (parity is on the reference DATA + the meta-GGA
# rung, not the whole training regime): plain CCSD, not CCSD(T) (basis+grid is the
# dominant parity lever; the (T) density correction is small and (T) at this basis on
# the 214-species held-out pool is prohibitive); DENSITY FITTING on (non-DF CCSD at
# 6-311++G(3df,2pd) is infeasible for the big held-out species -- propane = 267 basis
# fns; DF density ~ exact); full_3 SCF, not 25 cycles; AdamW + linear decay, not
# Adam + ReduceLROnPlateau. The GGA/rung-3.5 archs in the sweep keep the 1.804 ceiling
# + tanh^2(s) GGA gate + PBE pretraining (only the meta_gga archs close D2-D5).
#
# Fresh, basis-tagged reference/pretrain/output dirs (`_dfs6311_g3`): the final
# per-species npz skip-check is basis-blind, so reusing the def2-svp dirs would
# silently skip stale refs or overwrite the completed svp run. Distinct
# output_root -> additive, in-flight-safe; the completed svp_grid2_v3 run is
# untouched.
# =============================================================================

sweep:
  # A Jacob's-ladder A/B: baseline GGA -> +attn -> +cusp -> +cusp+rung35 (headline)
  # -> +attn -> +cusp+rung35+meta-GGA (combined richness) -> pure DFS meta-GGA
  # -> +attn. deep_cusp_3x16 is the CONTROL for the rung-3.5 A/B. The notransform
  # pair is CULLED (its log-transform ablation is a separate figure story) and
  # deep_rung35only is REPLACED by the combined deep_rung35_mgga to make room for
  # the meta-GGA archs at a fixed 8 archs / 88 specs.
  arch:
    - deep_3x16
    - deep_attn_3x16
    - deep_cusp_3x16
    - deep_rung35_3x16
    - deep_rung35_attn_3x16
    # DFS-faithful meta-GGA (meta_gga=True: iso-orbital alpha descriptor + DFS
    # (x2+tanh^2(x3)) gate + 1.174 LOB; PRETRAIN TO SCAN). deep_rung35_mgga stacks
    # cusp + rung-3.5 + meta-GGA (does the extra richness help?); deep_mgga is the
    # pure DFS meta-GGA (exchange on (s, alpha)).
    - deep_rung35_mgga_3x16
    - deep_mgga_3x16
    - deep_mgga_attn_3x16
  loss: [L5_gradnorm_vxc_step7]
  metric: [jsd]
  subset_size: [1, 2, 3, 4, 5, 6, 7, 12, 15, 18, 26]
  solver: [full_3]

# DFS self-consistency: step-decaying mixer (alpha=0.3**step+0.3) + tail-weighted
# energy loss on full_X. (The orientation lock is NOT set per-solver -- it is a
# run-level inputs field, authoritative for the whole run.)
solvers:
  full_3:
    mode: FULL
    max_cycles: 3
    feature_policy: REASSEMBLE
    mixer_name: decaying_linear
    mixer_kwargs: {base: 0.3, floor: 0.3}
    scf_loss_use_tail: true
    scf_loss_tail: 10
    scf_loss_weight_power: 2.0
  # ceiling fix, defined for a follow-up sweep (solver: [full_25]); not swept now.
  full_25:
    mode: FULL
    max_cycles: 25
    feature_policy: REASSEMBLE
    scf_grad_checkpoint: true
    mixer_name: decaying_linear
    mixer_kwargs: {base: 0.3, floor: 0.3}
    scf_loss_use_tail: true
    scf_loss_tail: 10
    scf_loss_weight_power: 2.0

hyperparams:
  # 200 epochs: enough for full_3 with the LR schedule (decay starts at 50% =
  # step 100, reaches lr_end by 200), with in-loop validation early-stop as the
  # safety net. NOT 150: the early-stop guard (patience >= n_checks-1, with
  # n_checks = n_steps // validate_every) trips at 150 (6 checks, patience 5);
  # 200 gives 8 checks so patience 5 is non-degenerate and early-stop can fire.
  n_steps: 200
  lr_start: 0.001
  lr_end: 0.00001
  lr_decay_start: 0.5
  grad_clip: 1.0
  gradnorm_alpha: 1.5
  vxc_weight: 0.01
  density_weight: 0.1
  density_per_electron: true
  pbe_anchor_weight: 0.0
  require_atom_anchors: false
  seed: 42
  weight_decay: 0.0001
  val_frac: 0.2
  validate_every: 25
  patience: 5
  early_stop_min_delta: 0.1
  checkpoint_every: 10
  # Shape padding: one common (n_ao, n_grid, naux) target over the whole batch so
  # the de-fused per-molecule kernels collapse to one compile per spin-type instead
  # of one per molecule -- at this basis/grid the per-molecule compile count drove
  # the process mapping count into the vm.max_map_count ceiling. Results-neutral
  # input pass (see xcquinox.alec.padding).
  pad_group_to_common_shape: true

inputs:
  # DFS-paper parity: same basis for training AND the CCSD references, grid 3.
  basis: 6-311++G(3df,2pd)
  grid_level: 3
  # DF makes non-DF-infeasible 6-311++G(3df,2pd) CCSD tractable (auxbasis unset ->
  # auto-select from the orbital basis). DF density ~ exact for density-matching.
  density_fit: true
  # Orientation lock (run-level, authoritative): locks OH/CH/NO reference +
  # training densities to the SAME degenerate component (orientation_lock.py).
  orientation_lock_strength: 0.00003
  # SAME subsets as the def2-svp run (apples-to-apples).
  subset_ledger_path: /gpfs/projects/FernandezGroup/Alec/xcquinox/notebooks/checkpoints_step7/alpha_on/subset_index_log.json
  # Fresh, basis-tagged reference/output dirs (do NOT collide with def2-svp).
  external_refs_dir: /gpfs/scratch/awills/external_refs_dfs_6311ppg3df2pd_g3
  benchmark_refs_dir: /gpfs/scratch/awills/external_refs_bench_6311ppg3df2pd_g3
  val_refs_dir: /gpfs/scratch/awills/external_refs_val_6311ppg3df2pd_g3
  output_root: /gpfs/scratch/awills/xcquinox_runs/dfs_step7/dfs6311_grid3_v3

pretrain:
  # fresh basis-tagged pretrain data (per-atom Fx/Fc at 6-311++G(3df,2pd)/grid3).
  data_dir: /gpfs/scratch/awills/pretrain_data_dfs_6311ppg3df2pd_g3_allelem
  n_steps: 2500
  lr_start: 0.01
  lr_end: 0.00001
  lr_decay_start: 0.2
  grad_clip: 1.0
  seed: 42
  loss_weighting: integration
  # Pretrain atoms = the training pool's elements. NOTE: He is DROPPED -- it is
  # absent from PySCF's 6-311++G(3df,2pd) (BasisNotFoundError) and unused by the
  # DFS training pool (see dfs_demo.py:262).
  atoms:
    H: 1
    Li: 1
    C: 2
    N: 3
    O: 2
    F: 1
    Na: 1

cluster:
  partition: ""
  time: "24:00:00"
  cpus_per_task: 24
  array_throttle: 4
  eval_array_throttle: 4
  max_concurrent_tasks: 8
  max_array_size: 1000
  device: cpu
  # OOM auto-retry -- engaged now that CPU XLA/LLVM *compile* OOMs classify as
  # "oom" (not "deterministic"); see HISTORY Phase 15. To make a compile-OOM'd
  # spec auto-resubmit onto more memory, uncomment and set this to a
  # LARGER-per-node-memory partition that EXISTS on the login instance you submit
  # from (e.g. long-96core on milan1/2 ~256 GB, vs long-28core ~128 GB). Must be
  # valid on the submitting instance or the retry sbatch is rejected. Leave unset
  # if the biggest reachable node is already your submit --partition -- a
  # same-partition retry cannot clear a deterministic compile OOM; the
  # --xla_llvm_disable_expensive_passes trim in the train template is the
  # no-bigger-node lever there.
  # oom_retry_partition: long-96core
  # jax-0.7.0 PARITY env (matches the local dev/test stack the meta-GGA code was
  # tested on) -- a fresh, single-purpose conda-forge+pip env built from
  # environment-cluster-parity.yml. NOT the old polluted xcquinox env (jax 0.4.35).
  conda_env: /gpfs/projects/FernandezGroup/Alec/conda_envs/xcquinox_j070
  conda_profile: /gpfs/projects/FernandezGroup/Alec/miniconda3/etc/profile.d/conda.sh
  mail_user: alec.wills@stonybrook.edu
  mail_type: BEGIN,END,FAIL
  account: ""
  preflight_time: "12:00:00"
  # Compile-smoke gate: the preflight compiles the heaviest attention cell once
  # (n_steps=1) on its exclusive node before the 88-task array; a host-OOM there
  # blocks the array via the afterok dep -- one cheap failure instead of ~80.
  preflight_compile_smoke: true
  eval_time: "02:00:00"
  pretrain_time: "12:00:00"
  # The 214-species held-out CCSD at 6-311++G(3df,2pd) (even DF) is slow for the
  # big species; the job is skip-if-complete + resumable, so it grinds through
  # across requeues.
  benchmark_refs_time: "24:00:00"

domain_profile: dfs_step7

on_precompute_failure: abort
bh76_mode: reaction_energy
ae_as_reactions: true
use_polarized_correlation: true
held_out_strict: true

inline_eval: true
defer_eval: false

# BH76 objective: this campaign trained the historical reaction-energy
# substitution (GMTKN55 BH76RC reaction energies; no transition states in
# the pool). Stated explicitly for the record -- prepare/submit refuse a
# DFS config that leaves the mode silent. Resubmitting this file reproduces
# the substitution; barrier training sets bh76_mode: barrier_height.
bh76_mode: reaction_energy
