# =============================================================================
# dfs_step7.svp_grid2_v3_full25.yaml -- the v3 decoupling-fixes job with the
# DFS-fidelity SCF CEILING fix (25-cycle FULL SCF + gradient checkpointing).
#
# Identical to dfs_step7.svp_grid2_v3.yaml EXCEPT solver = full_25 (max_cycles 25,
# scf_grad_checkpoint on). This is the FOLLOW-UP to run once the v3 (full_3) A/B
# shows the capacity+regularization fixes shrink the held-out gap: full_25 trains
# on a more self-consistent NN density (3 cycles from the converged PBE seed
# cannot reach the NN functional's own fixed point), raising the achievable
# ceiling rather than the decoupling.
#
# WALLTIME: 25-cycle backprop is ~8x the per-step SCF compute of full_3 (the
# per-molecule scheme keeps it MEMORY-bounded, scf_grad_checkpoint adds ~1.5x
# recompute -- cost is walltime, not RAM). It WILL exceed a single SLURM window;
# that is FINE -- checkpoint_every=10 + the WS5/WS6 resumable harness means a
# wall-clock kill leaves a resume_* checkpoint and `cluster resubmit --submit`
# CONTINUES it from there. Run resubmit until status shows all specs success.
# =============================================================================

sweep:
  arch:
    - deep_3x16
    - deep_attn_3x16
    # rung-3.5 localized-DM archs replace the leaky deep_dm/deep_combined (which
    # stay in the registry so the in-flight array still resolves them). The
    # occupancy descriptor is leak-free + self-consistent (Janesko 2206.07118 /
    # M11plus). deep_cusp_3x16 is KEPT as the CONTROL for the A/B: deep_cusp vs
    # deep_rung35 (cusp+localized DM) vs the frozen deep_combined (cusp+global DM).
    - deep_rung35only_3x16
    - deep_cusp_3x16
    - deep_rung35_3x16
    - deep_rung35_attn_3x16
    - deep_notransform_3x16
    - deep_notransform_attn_3x16
  loss: [L5_gradnorm_vxc_step7]
  metric: [jsd]
  subset_size: [1, 2, 3, 4, 5, 6, 7, 12, 15, 18, 26]
  solver: [full_25]

# 2026-06-24: DFS self-consistency fix on ALL full_X. full_25 forced 25 cycles
# but scored only the FINAL SCF step; for hard species (TS, radicals) the
# NN-SCF left the PBE basin into a period-2 oscillation the constant alpha=0.5
# mixer could not damp, so the final-step energy was an arbitrary phase (+1000s
# kcal/mol). Fix = the DFS step-decaying mixer (alpha=0.3**step+0.3) + the
# tail-weighted energy loss (quadratic weight over the last scf_loss_tail SCF
# steps, generalized to any max_cycles). full_3 keeps the same knobs for parity
# (step N-1 dominates, so it stays ~unchanged).
solvers:
  full_3:
    mode: FULL
    max_cycles: 3
    feature_policy: REASSEMBLE
    mixer_name: decaying_linear
    mixer_kwargs: {base: 0.3, floor: 0.3}
    scf_loss_use_tail: true
    scf_loss_tail: 10
    scf_loss_weight_power: 2.0
  full_25:
    mode: FULL
    max_cycles: 25
    feature_policy: REASSEMBLE
    scf_grad_checkpoint: true
    mixer_name: decaying_linear
    mixer_kwargs: {base: 0.3, floor: 0.3}
    scf_loss_use_tail: true
    scf_loss_tail: 10
    scf_loss_weight_power: 2.0

hyperparams:
  n_steps: 500
  lr_start: 0.001
  lr_end: 0.00001
  lr_decay_start: 0.5
  grad_clip: 1.0
  gradnorm_alpha: 1.5
  vxc_weight: 0.01
  density_weight: 0.1
  density_per_electron: true
  pbe_anchor_weight: 0.0
  require_atom_anchors: false
  seed: 42
  weight_decay: 0.0001
  val_frac: 0.2
  validate_every: 25
  patience: 5
  early_stop_min_delta: 0.1
  checkpoint_every: 10

inputs:
  external_refs_dir: /gpfs/scratch/awills/external_refs_dfs_svp_g2
  subset_ledger_path: /gpfs/projects/FernandezGroup/Alec/xcquinox/notebooks/checkpoints_step7/alpha_on/subset_index_log.json
  basis: def2-svp
  grid_level: 2
  density_fit: false
  output_root: /gpfs/scratch/awills/xcquinox_runs/dfs_step7/svp_grid2_v3_full25
  benchmark_refs_dir: /gpfs/scratch/awills/external_refs_bench_svp_g2
  val_refs_dir: /gpfs/scratch/awills/external_refs_val_dfs_svp_g2
  # campaign ran unlocked; stated so the harness default (3e-5) cannot change it
  orientation_lock_strength: 0.0

pretrain:
  data_dir: /gpfs/scratch/awills/pretrain_data_dfs_svp_g2_allelem
  n_steps: 2500
  lr_start: 0.01
  lr_end: 0.00001
  lr_decay_start: 0.2
  grad_clip: 1.0
  seed: 42
  loss_weighting: integration
  atoms:
    H: 1
    He: 0
    Li: 1
    C: 2
    N: 3
    O: 2
    F: 1
    Na: 1

cluster:
  partition: ""
  time: "48:00:00"          # ~8x full_3 SCF; relies on resumable resubmit to span windows
  cpus_per_task: 24
  array_throttle: 4
  eval_array_throttle: 4
  max_concurrent_tasks: 8
  max_array_size: 1000
  device: cpu
  conda_env: /gpfs/projects/FernandezGroup/Alec/conda_envs/xcquinox
  conda_profile: /gpfs/projects/FernandezGroup/Alec/miniconda3/etc/profile.d/conda.sh
  mail_user: alec.wills@stonybrook.edu
  mail_type: BEGIN,END,FAIL
  account: ""
  preflight_time: "08:00:00"
  eval_time: "08:00:00"     # held-out eval also runs full_25 (~8x full_3 eval)
  pretrain_time: "08:00:00"
  benchmark_refs_time: "24:00:00"

domain_profile: dfs_step7

on_precompute_failure: abort
bh76_mode: reaction_energy
ae_as_reactions: true
use_polarized_correlation: true
held_out_strict: true

inline_eval: true
defer_eval: false
