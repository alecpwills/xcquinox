# =============================================================================
# dfs_step8.v9_dfs_letter_parity.yaml -- ARM i OF THE v9 LETTER-PARITY
#    PROGRAM: exact published-protocol parity at the GGA rung.
#
# One cell: deep_3x16 (the "S_deep_3x16" of the Letter's GGA fine-tune),
# warm-started from the v8 arm-S PRETRAIN-stage checkpoint (pretraining
# parentage shared with arm ii; fine-tuning from an already-fine-tuned
# network would contaminate the parity experiment with the DFS fine-tune
# set). The full 26-point pool with the published self-consistency split
# honored: 13 SC training points, the 8 non-linear AE + 3 BH76 + 2 IP13
# entries staged non-self-consistent at nonsc_weight 0.01.
#
# The protocol constants are the EXECUTED protocol (the vendored
# dpyscf/torch_routines.py), not the SI prose: the decaying mixer
# 0.3**step + 0.3 with step_offset 1 (first mix 0.6), 25 fixed SCF cycles
# with the trajectory weight linspace(0,1,25)**2 over all of them
# (scf_loss_tail == max_cycles), no convergence freeze, symmetrized
# half-normal Fock noise at 1e-5 on the differentiable path (train-mode
# only, seeded and folded with the cycle), and the per-update dm seed
# mixture (seed_mix_atomic, b = rand()/2 + 0.5). Letter weights only:
# reactions 1, CCSD densities 20 (per-electron), atomic totals 0.01
# (loss_Eatom, absolute Ha^2, unscaled by nonsc), no vxc.
#
# Validation is the manifest set (si_letter_validation.json: the executed
# code's 10 reactions), selected on MAE + sqrt(20) * mean relative density
# deviation (validation_density_weight), every 10 epochs, patience 8.
# The 8 AE compound CCSD density references for that metric are generated
# by benchmark_refs --manifest into inputs.val_refs_dir (cluster job 1 of
# the program). Submit with --stages all so datagen renders the validation
# slice; the pretrain stage self-omits (the only arch is donated).
# =============================================================================

sweep:
  arch: [deep_3x16]
  loss: [L6_letter_parity]
  metric: [jsd]
  subset_size: [26]
  solver: [full_25]

solvers:
  full_25:
    mode: FULL
    max_cycles: 25
    feature_policy: REASSEMBLE
    scf_grad_checkpoint: true
    mixer_name: decaying_linear
    mixer_kwargs: {base: 0.3, floor: 0.3, step_offset: 1}
    scf_loss_use_tail: true
    scf_loss_tail: 25
    scf_loss_weight_power: 2.0
    freeze_on_convergence: false
    # the executed degeneracy noise: symmetrized |N(0,1)|*1e-5 on the
    # assembled Fock, differentiable path only, seed folded with the cycle
    fock_noise_std: 1.0e-5
    fock_noise_seed: 0

hyperparams:
  n_steps: 100
  lr_start: 1.0e-4
  lr_end: 1.0e-7
  lr_decay_start: 0.5
  grad_clip: 1.0
  gradnorm_alpha: 1.5
  vxc_weight: 0.01
  density_weight: 0.1
  density_per_electron: true
  pbe_anchor_weight: 0.0
  require_atom_anchors: false
  seed: 42
  weight_decay: 1.0e-6
  val_frac: 0.2
  validate_every: 10
  # 80 stagnant epochs: the published loop is unbounded (100000 epochs,
  # killed manually, best checkpoint by best loss -- no early-stop
  # patience), so 8 is the live bound the semantics guard admits at this
  # step budget (10 checks -> patience <= 8), not a published constant
  patience: 8
  early_stop_min_delta: 0.1
  checkpoint_every: 10
  pad_group_to_common_shape: true
  update_scheme: per_molecule
  optimizer: adam_plateau
  plateau_patience: 10
  plateau_factor: 0.1
  seed_mix_atomic: true
  # the published split: the 8 non-linear AE + 3 BH76 + 2 IP13 entries are
  # staged non-self-consistent, energy channels at 0.01
  respect_sc_flag: true
  nonsc_weight: 0.01
  channel_weights: {loss_AE: 1.0, loss_BH76: 1.0, loss_IP13: 1.0,
                    loss_rho: 20.0, loss_vxc: 0.0, loss_Eatom: 0.01}
  # the selection loss carries the density term at sqrt(20) relative weight
  validation_density_weight: 20.0

inputs:
  basis: 6-311++G(3df,2pd)
  grid_level: 3
  density_fit: true
  orientation_lock_strength: 3.0e-5
  seed_xc: auto
  seed_cache_dir: /gpfs/scratch/awills/seed_cache_scan_6311ppg3df2pd_g3
  subset_ledger_path: /gpfs/projects/FernandezGroup/Alec/xcquinox/notebooks/checkpoints_step7/alpha_on/subset_index_log.json
  external_refs_dir: /gpfs/scratch/awills/external_refs_dfs_6311ppg3df2pd_g3
  benchmark_refs_dir: /gpfs/scratch/awills/external_refs_bench_6311ppg3df2pd_g3
  # the manifest validation set's own CCSD density references (job 1 writes
  # every manifest species that carries a reference -- the 8 AE compounds,
  # the element atoms and the barrier species -- here via benchmark_refs
  # --manifest)
  val_refs_dir: /gpfs/scratch/awills/external_refs_letter_val_6311ppg3df2pd_g3
  # the executed validation set replaces the held-out-pool slice
  validation_manifest: /gpfs/projects/FernandezGroup/Alec/xcquinox/xcquinox/pipeline/data/si_letter_validation.json
  output_root: /gpfs/scratch/awills/xcquinox_runs/dfs_step8/v9_dfs_letter_parity

pretrain:
  data_dir: /gpfs/scratch/awills/pretrain_data_dfs_6311ppg3df2pd_g3_v8
  n_steps: 20000
  lr_start: 1.0e-3
  lr_end: 1.0e-5
  lr_decay_start: 0.5
  lr_decay_end: 0.9
  grad_clip: 0
  seed: 42
  loss_weighting: rho_w_sampled
  points_per_system: 800
  sampling_seed: 42
  atoms:
    H: 1
    Li: 1
    C: 2
    N: 3
    O: 2
    F: 1
    Na: 1
  dfs_set: true
  pool_atoms: true
  parent_density: auto
  exchange_footing: paper
  mesh_fraction: 0.3
  energy_term_weight: 0.0
  validation_fraction: 0.0
  validation_seed: 0
  validate_every: 50
  patience: 0
  # the Letter's "pre-trained S_deep_3x16": arm S's PRETRAIN-stage output
  # (run_20260924T143620Z, the arm-S training run's own pretrain products),
  # so this arm and arm ii share parentage and differ in protocol alone
  donor_checkpoints:
    deep_3x16: /gpfs/scratch/awills/xcquinox_runs/dfs_step8/v8_dfs_allsc/runs/run_20260924T143620Z/pretrain/deep_3x16

cluster:
  partition: ""
  time: "96:00:00"
  cpus_per_task: 24
  array_throttle: 4
  eval_array_throttle: 4
  max_concurrent_tasks: 8
  max_array_size: 1000
  device: cpu
  oom_retry_partition: extended-96core
  timeout_retry_partition: extended-96core
  timeout_retry_time: "168:00:00"
  conda_env: /gpfs/projects/FernandezGroup/Alec/conda_envs/xcquinox_j0102
  conda_profile: /gpfs/projects/FernandezGroup/Alec/miniconda3/etc/profile.d/conda.sh
  mail_user: alec.wills@stonybrook.edu
  mail_type: BEGIN,END,FAIL
  account: ""
  preflight_time: "12:00:00"
  preflight_compile_smoke: true
  preflight_coldstart_census: true
  eval_time: "12:00:00"
  pretrain_time: "48:00:00"
  pretrain_throttle: 4
  datagen_time: "04:00:00"
  benchmark_refs_time: "24:00:00"

domain_profile: dfs_step7
on_precompute_failure: abort
bh76_mode: barrier_height
ae_as_reactions: true
use_polarized_correlation: true
inline_eval: true
eval_coldstart: true
defer_eval: false

model:
  parent_anchor: false
  descriptor_coordinates: paper
  ueg_gate: x2

fidelity:
  tol_AE: 1.0
  tol_atom: 1.0
  tol_AE_aggregate: mae
  tol_AE_max_backstop: 2.0
  override_reason: null
  enforce: true
