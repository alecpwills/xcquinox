# =============================================================================
# dfs_step7.dfs6311_grid3_v4.yaml -- corrected-V_xc descriptor-ablation
# re-sweep: every family the correction affects, at DFS-paper-parity data.
#
# WHY A v4: every v3 cell trained before the 2026-08-06 V_xc correction (the
# feature-response term sum_g w_g (de/df)_g . df_g/dP was absent for
# DM-dependent descriptors) from a SCAN-clone pretrain whose alpha axis the
# atomic grids underdetermine, and the v3 array's tail additionally straddled
# a mid-flight library sync, so its not-yet-run cells had no clean provenance
# class. v3 closes as the pre-correction record (specs 0000-0047). This sweep
# re-runs everything the correction touches -- only the GGA family is
# excluded, because grid-local descriptors never had the missing term and the
# completed deep/attn/cusp rows are already correct.
#
# SEVEN ARCHS, the descriptor-ablation grid ("what descriptors help"):
#
#   arch                     descriptors              pretrain
#   deep_mgga_3x16           metagga                  SCAN + (s,alpha) MESH
#   deep_mgga_attn_3x16      metagga (+attention)     SCAN + (s,alpha) MESH
#   deep_rung35only_3x16     rung35                   PBE-form
#   deep_rung35_3x16         cusp+rung35              PBE-form
#   deep_rung35_attn_3x16    cusp+rung35 (+attn)      PBE-form
#   deep_rung35ms_3x16       cusp+rung35_multishell   PBE-form
#   deep_rung35_mgga_3x16    cusp+rung35+metagga      SCAN, NO mesh (below)
#
# Ablation chains: attention (rows 1v2, 4v5), cusp (3v4), multi-width
# rung-3.5 (4v6), metagga stacking (4v7), rung-3 vs rung-3.5 (1v3/4), with
# v3's valid GGA rows as the cross-run baseline.
#
# PRETRAIN-TARGET POLICY: each arch pretrains to the best functional its
# inputs can EXACTLY represent. SCAN's enhancement factors are multivalued at
# fixed (rho, sigma) -- they depend irreducibly on alpha -- so the GGA-based
# rung-3.5 archs (no alpha input, by rung purity) keep PBE, which IS a GGA:
# the clone is faithful (measured <= 0.013), SCF-safe, and the DFS paper's
# own protocol (deviation D5). The alpha-bearing mgga archs pretrain to SCAN
# with the (s, alpha) parameter mesh appended (2026-08-10): the atomic grids
# alone leave SCAN's alpha axis underdetermined (measured up to 0.457 from
# SCAN in F_c away from alpha=1; pretrained-only held-out MAE 42.65 kcal/mol
# against SCAN's 4.45 on the same 164 reactions).
#
# CAVEATS carried, not hidden:
# - deep_rung35_mgga_3x16 pretrains to SCAN WITHOUT the mesh: a mesh node is
#   a synthetic (rho, sigma, tau) triple with no geometry, so it cannot
#   define the cusp/rung-3.5 columns this arch consumes. Its initialization
#   therefore remains the underdetermined-alpha clone; it stays as the
#   stacking cell, and its small-subset cells read with that caveat.
# - For the mgga families the cross-run v3 comparison is potential+pretrain
#   JOINTLY (both were broken; two variables, unavoidable). The rung-3.5
#   rows are a single-variable A/B (potential only).
# - The 3-cycle corrected trajectory (the regime this sweep actually runs;
#   training and eval are both full_3) is verified contracting for the mgga
#   archs; the 25-cycle oscillation measured 2026-08-10 gates only the
#   full_25 follow-up, not this sweep.
#
# Everything else -- subsets, solver, hyperparameters, reference data, basis,
# grid, orientation lock -- is IDENTICAL to v3. The reference/pretrain-data/
# subset-ledger dirs are shared with v3 on purpose: input data keyed by
# species/basis/grid, complete, and on the relocked CH/NO references
# throughout -- so this run has NO reference boundary. A fresh output_root
# keeps the run additive; the v3 run dir is untouched.
# =============================================================================

sweep:
  # NOTE: expand_grid canonicalizes the arch axis ALPHABETICALLY regardless of
  # the listing order here, so array task indices map as: 0-10 deep_mgga,
  # 11-21 deep_mgga_attn, 22-32 deep_rung35, 33-43 deep_rung35_attn,
  # 44-54 deep_rung35_mgga, 55-65 deep_rung35ms, 66-76 deep_rung35only.
  # v3's completed GGA rows are the rung-2 baseline.
  arch:
    - deep_mgga_3x16
    - deep_mgga_attn_3x16
    - deep_rung35only_3x16
    - deep_rung35_3x16
    - deep_rung35_attn_3x16
    - deep_rung35ms_3x16
    - deep_rung35_mgga_3x16
  loss: [L5_gradnorm_vxc_step7]
  metric: [jsd]
  subset_size: [1, 2, 3, 4, 5, 6, 7, 12, 15, 18, 26]
  solver: [full_3]

# DFS self-consistency: step-decaying mixer (alpha=0.3**step+0.3) + tail-weighted
# energy loss on full_X. (The orientation lock is NOT set per-solver -- it is a
# run-level inputs field, authoritative for the whole run.)
solvers:
  full_3:
    mode: FULL
    max_cycles: 3
    feature_policy: REASSEMBLE
    mixer_name: decaying_linear
    mixer_kwargs: {base: 0.3, floor: 0.3}
    scf_loss_use_tail: true
    scf_loss_tail: 10
    scf_loss_weight_power: 2.0
  # ceiling fix, defined for a follow-up sweep (solver: [full_25]); not swept now.
  full_25:
    mode: FULL
    max_cycles: 25
    feature_policy: REASSEMBLE
    scf_grad_checkpoint: true
    mixer_name: decaying_linear
    mixer_kwargs: {base: 0.3, floor: 0.3}
    scf_loss_use_tail: true
    scf_loss_tail: 10
    scf_loss_weight_power: 2.0

hyperparams:
  # 200 epochs: enough for full_3 with the LR schedule (decay starts at 50% =
  # step 100, reaches lr_end by 200), with in-loop validation early-stop as the
  # safety net. NOT 150: the early-stop guard (patience >= n_checks-1, with
  # n_checks = n_steps // validate_every) trips at 150 (6 checks, patience 5);
  # 200 gives 8 checks so patience 5 is non-degenerate and early-stop can fire.
  n_steps: 200
  lr_start: 0.001
  lr_end: 0.00001
  lr_decay_start: 0.5
  grad_clip: 1.0
  gradnorm_alpha: 1.5
  vxc_weight: 0.01
  density_weight: 0.1
  density_per_electron: true
  pbe_anchor_weight: 0.0
  require_atom_anchors: false
  seed: 42
  weight_decay: 0.0001
  val_frac: 0.2
  validate_every: 25
  patience: 5
  early_stop_min_delta: 0.1
  checkpoint_every: 10
  # Shape padding: one common (n_ao, n_grid, naux) target over the whole batch so
  # the de-fused per-molecule kernels collapse to one compile per spin-type instead
  # of one per molecule -- at this basis/grid the per-molecule compile count drove
  # the process mapping count into the vm.max_map_count ceiling. Results-neutral
  # input pass (see xcquinox.alec.padding).
  pad_group_to_common_shape: true

inputs:
  # DFS-paper parity: same basis for training AND the CCSD references, grid 3.
  basis: 6-311++G(3df,2pd)
  grid_level: 3
  # DF makes non-DF-infeasible 6-311++G(3df,2pd) CCSD tractable (auxbasis unset ->
  # auto-select from the orbital basis). DF density ~ exact for density-matching.
  density_fit: true
  # Orientation lock (run-level, authoritative): locks OH/CH/NO reference +
  # training densities to the SAME degenerate component (orientation_lock.py).
  orientation_lock_strength: 0.00003
  # SAME subsets as the v3/def2-svp runs (apples-to-apples).
  subset_ledger_path: /gpfs/projects/FernandezGroup/Alec/xcquinox/notebooks/checkpoints_step7/alpha_on/subset_index_log.json
  # SHARED with v3 (complete, relocked; input data keyed by species/basis/grid).
  external_refs_dir: /gpfs/scratch/awills/external_refs_dfs_6311ppg3df2pd_g3
  benchmark_refs_dir: /gpfs/scratch/awills/external_refs_bench_6311ppg3df2pd_g3
  val_refs_dir: /gpfs/scratch/awills/external_refs_val_6311ppg3df2pd_g3
  # Fresh output root: additive, the v3 run dir is untouched.
  output_root: /gpfs/scratch/awills/xcquinox_runs/dfs_step7/dfs6311_grid3_v4

pretrain:
  # SHARED data_dir with v3 -- and the datagen stage WILL REGENERATE the npz
  # in place: the 2026-07-28 file predates the rung35ms_all column, and the
  # staleness check added with that column judges it stale. The regeneration
  # is value-identical for every column this sweep consumes (only the dm
  # block narrowed 3 -> 2 and rung35ms_all was added since; verified against
  # the intervening commits), but it OVERWRITES v3's pretrain input -- back
  # up pretrain_data_polarized.npz first if the v3 file's exact bytes matter
  # for provenance. Seven atoms at this basis/grid fit the datagen window.
  # The CHECKPOINTS are per-run: this run pretrains its seven architectures
  # fresh with the corrected code into its own pretrain/ dir, and the run
  # validator cross-checks the written meta_gga / n_extra_features /
  # pretrain_steps provenance keys against the specs that load them.
  data_dir: /gpfs/scratch/awills/pretrain_data_dfs_6311ppg3df2pd_g3_allelem
  n_steps: 2500
  lr_start: 0.01
  lr_end: 0.00001
  lr_decay_start: 0.2
  grad_clip: 1.0
  seed: 42
  loss_weighting: integration
  # Pretrain atoms = the training pool's elements. NOTE: He is DROPPED -- it is
  # absent from PySCF's 6-311++G(3df,2pd) (BasisNotFoundError) and unused by the
  # DFS training pool (see dfs_demo.py:262).
  atoms:
    H: 1
    Li: 1
    C: 2
    N: 3
    O: 2
    F: 1
    Na: 1

cluster:
  partition: ""
  # 48 h, NOT 24: v3 measured single-process train durations at this exact
  # basis/grid/solver up to 42.14 h (deep_attn_3x16, subset 26; attention is
  # 2.3-2.9x its non-attention twin), and v3 itself ran under a 48 h wall via
  # the submit-time --time override -- a bare submission of a 24 h YAML would
  # wall-kill the attention cells at large subsets. The corrected potential
  # adds a feature-response derivative per SCF cycle, so the attention cells
  # will not be faster than v3's. Peak measured RSS is 142.8 GB: submit to a
  # ~256 GB partition (long-96core), never a 128 GB one.
  time: "48:00:00"
  cpus_per_task: 24
  array_throttle: 4
  eval_array_throttle: 4
  max_concurrent_tasks: 8
  max_array_size: 1000
  device: cpu
  # OOM auto-retry -- engaged now that CPU XLA/LLVM *compile* OOMs classify as
  # "oom" (not "deterministic"); see HISTORY Phase 15. To make a compile-OOM'd
  # spec auto-resubmit onto more memory, uncomment and set this to a
  # LARGER-per-node-memory partition that EXISTS on the login instance you submit
  # from (e.g. long-96core on milan1/2 ~256 GB, vs long-28core ~128 GB). Must be
  # valid on the submitting instance or the retry sbatch is rejected. Leave unset
  # if the biggest reachable node is already your submit --partition -- a
  # same-partition retry cannot clear a deterministic compile OOM; the
  # --xla_llvm_disable_expensive_passes trim in the train template is the
  # no-bigger-node lever there.
  # oom_retry_partition: long-96core
  # jax-0.7.0 PARITY env (matches the local dev/test stack the meta-GGA code was
  # tested on) -- a fresh, single-purpose conda-forge+pip env built from
  # environment-cluster-parity.yml. NOT the old polluted xcquinox env (jax 0.4.35).
  conda_env: /gpfs/projects/FernandezGroup/Alec/conda_envs/xcquinox_j070
  conda_profile: /gpfs/projects/FernandezGroup/Alec/miniconda3/etc/profile.d/conda.sh
  mail_user: alec.wills@stonybrook.edu
  mail_type: BEGIN,END,FAIL
  account: ""
  preflight_time: "12:00:00"
  # Compile-smoke gate: the preflight compiles the heaviest attention cell once
  # (n_steps=1) on its exclusive node before the 77-task array; a host-OOM there
  # blocks the array via the afterok dep -- one cheap failure instead of ~70.
  preflight_compile_smoke: true
  eval_time: "02:00:00"
  pretrain_time: "12:00:00"
  # The 214-species held-out CCSD at 6-311++G(3df,2pd) (even DF) is slow for the
  # big species; the job is skip-if-complete + resumable, so it grinds through
  # across requeues. With the refs dirs shared and complete from v3, this stage
  # should reduce to a skip-if-current verification pass.
  benchmark_refs_time: "24:00:00"

domain_profile: dfs_step7

on_precompute_failure: abort
bh76_mode: reaction_energy
ae_as_reactions: true
use_polarized_correlation: true
held_out_strict: true

inline_eval: true
defer_eval: false
