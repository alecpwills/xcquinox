# =============================================================================
# dfs_step7.svp_grid2_v3_rung35ab.yaml -- FOCUSED deep_cusp vs deep_rung35 A/B.
#
# Tests the Phase-13 hypothesis directly: was the deep_combined held-out collapse
# (the global dm_statistics molecule-identity leak) fixed by LOCALIZING the DM
# (rung 3.5)? Sweeps only the control + the two rung-3.5 archs on the SAME
# dfs_step7 subsets, basis (def2-svp), and full_3 regime as svp_grid2_v3, so the
# result reads apples-to-apples against the frozen deep_combined run
# (run_20260625T191113Z) on identical settings:
#   deep_cusp_3x16        -- CONTROL (cusp only)
#   deep_rung35_3x16      -- cusp + localized rung-3.5 DM occupancy
#   deep_rung35_attn_3x16 -- + attention
# 3 archs x 11 subsets = 33 train_eval specs. Distinct output_root so it neither
# collides with nor disturbs the in-flight v3 (deep_combined) array.
# =============================================================================

sweep:
  arch:
    - deep_cusp_3x16
    - deep_rung35_3x16
    - deep_rung35_attn_3x16
  loss: [L5_gradnorm_vxc_step7]
  metric: [jsd]
  subset_size: [1, 2, 3, 4, 5, 6, 7, 12, 15, 18, 26]
  solver: [full_3]

# DFS self-consistency fix (decaying mixer + tail-weighted energy loss), same as
# svp_grid2_v3's full_3 block.
solvers:
  full_3:
    mode: FULL
    max_cycles: 3
    feature_policy: REASSEMBLE
    mixer_name: decaying_linear
    mixer_kwargs: {base: 0.3, floor: 0.3}
    scf_loss_use_tail: true
    scf_loss_tail: 10
    scf_loss_weight_power: 2.0

hyperparams:
  n_steps: 500
  lr_start: 0.001
  lr_end: 0.00001
  lr_decay_start: 0.5
  grad_clip: 1.0
  gradnorm_alpha: 1.5
  vxc_weight: 0.01
  density_weight: 0.1
  density_per_electron: true
  pbe_anchor_weight: 0.0
  require_atom_anchors: false
  seed: 42
  weight_decay: 0.0001
  val_frac: 0.2
  validate_every: 25
  patience: 5
  early_stop_min_delta: 0.1
  checkpoint_every: 10

inputs:
  external_refs_dir: /gpfs/scratch/awills/external_refs_dfs_svp_g2
  subset_ledger_path: /gpfs/projects/FernandezGroup/Alec/xcquinox/notebooks/checkpoints_step7/alpha_on/subset_index_log.json
  basis: def2-svp
  grid_level: 2
  density_fit: false
  # DISTINCT output_root: keeps this A/B separate from the in-flight v3 run.
  output_root: /gpfs/scratch/awills/xcquinox_runs/dfs_step7/svp_grid2_v3_rung35ab
  benchmark_refs_dir: /gpfs/scratch/awills/external_refs_bench_svp_g2
  val_refs_dir: /gpfs/scratch/awills/external_refs_val_dfs_svp_g2
  # These campaigns ran UNLOCKED -- in training, in their CCSD references and
  # in their pretraining data. The data generator applied no orientation lock
  # at all before 2026-08-23, and every pretraining manifest and reference
  # intermediate they left on disk carries the unlocked identity (no lock key
  # in the manifests; no _ol tag on any of the cached intermediates). Stated
  # as 0.0 rather than left to the harness default, which is now the
  # calibrated 3e-5: an omitted key would re-identify the campaign, so a
  # re-run would discard the pretraining file it consumed and recompute its
  # whole CCSD reference set.
  orientation_lock_strength: 0.0
  # Two conditions at once, and one waiver covers both: grid level 2 does not
  # resolve a spatially degenerate free atom's P term whatever the lock is,
  # and with the lock off the SCF may land on any orientation of the hole
  # however fine the grid. This campaign's degenerate-atom rows are one
  # arbitrary member of their manifold, so the data generator refuses to
  # rebuild them unless the run says otherwise. Waived deliberately: this IS
  # the identity the finished campaign was run at, and the waiver is what puts
  # that on the record.
  allow_irreproducible_degenerate: true
  irreproducible_degenerate_reason: >-
    historical campaign identity at grid level 2, unlocked; the finished
    runs consumed pretraining data and CCSD references built at exactly this
    identity, and the campaign is not re-run at a finer grid

pretrain:
  data_dir: /gpfs/scratch/awills/pretrain_data_dfs_svp_g2_allelem
  n_steps: 2500
  lr_start: 0.01
  lr_end: 0.00001
  lr_decay_start: 0.2
  grad_clip: 1.0
  seed: 42
  loss_weighting: integration
  # one pretrain checkpoint per distinct arch (deep_cusp + the 2 rung-3.5 archs);
  # the per-atom Fx/Fc pretrain DATA is arch-size-independent (shared data_dir).
  atoms:
    H: 1
    He: 0
    Li: 1
    C: 2
    N: 3
    O: 2
    F: 1
    Na: 1

cluster:
  partition: ""
  time: "24:00:00"
  cpus_per_task: 24
  array_throttle: 4
  eval_array_throttle: 4
  max_concurrent_tasks: 8
  max_array_size: 1000
  device: cpu
  conda_env: /gpfs/projects/FernandezGroup/Alec/conda_envs/xcquinox
  conda_profile: /gpfs/projects/FernandezGroup/Alec/miniconda3/etc/profile.d/conda.sh
  mail_user: alec.wills@stonybrook.edu
  mail_type: BEGIN,END,FAIL
  account: ""
  preflight_time: "08:00:00"
  eval_time: "02:00:00"
  pretrain_time: "08:00:00"
  benchmark_refs_time: "24:00:00"

domain_profile: dfs_step7

on_precompute_failure: abort
bh76_mode: reaction_energy
ae_as_reactions: true
use_polarized_correlation: true
held_out_strict: true

inline_eval: true
defer_eval: false
