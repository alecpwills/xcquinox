# =============================================================================
# dfs_step7.svp_grid2_v3.yaml -- the GENERALIZATION-GAP decoupling fixes
# (2026-06-20 adversarial review, reports_local/dfs_discrepancy_review_2026-06-20.md).
#
# v2 fixed the training REGIME (ae_as_reactions, density per-electron, LR/budget,
# pretrain coverage). The review found the residual failure-to-beat-PBE is a
# COMPOUND generalization gap -- over-capacity nets trained with none of DFS's
# anti-overfit machinery. v3 applies the three ranked DECOUPLING fixes on top of
# the v2 regime, as a controlled v2 -> v3 A/B (same 88-cell grid, basis, solver):
#
#   1. CAPACITY (#1): the 8 archs are the depth-3/width-16 `*_3x16` twins,
#      matching DFS's published net size (~0.6k vs our ~3.3k params/net).
#   2. L2 weight decay (#2): adamw decoupled decay (DFS trains with L2; we did not).
#   3. Held-out VALIDATION early-stop + validation-best selection (#3): a disjoint
#      slice of W4-11+BH76 drives early-stop; the reported held-out metric is the
#      complementary TEST slice (no leakage).
#
# Plus harness resilience: checkpoint_every makes each task RESUMABLE (the
# maintenance/walltime outage that wasted runs now continues from checkpoint).
# full_25 (25-cycle FULL SCF + grad-checkpointing) is DEFINED but NOT swept here
# -- it is the DFS-fidelity "ceiling" fix for a follow-up once the gap closes.
# =============================================================================

sweep:
  arch:
    - deep_3x16
    - deep_attn_3x16
    # rung-3.5 localized-DM archs replace the leaky deep_dm/deep_combined (which
    # stay in the registry so the in-flight array still resolves them). The
    # occupancy descriptor is leak-free + self-consistent (Janesko 2206.07118 /
    # M11plus). deep_cusp_3x16 is KEPT as the CONTROL for the A/B: deep_cusp vs
    # deep_rung35 (cusp+localized DM) vs the frozen deep_combined (cusp+global DM).
    - deep_rung35only_3x16
    - deep_cusp_3x16
    - deep_rung35_3x16
    - deep_rung35_attn_3x16
    - deep_notransform_3x16
    - deep_notransform_attn_3x16
  loss: [L5_gradnorm_vxc_step7]
  metric: [jsd]
  subset_size: [1, 2, 3, 4, 5, 6, 7, 12, 15, 18, 26]
  solver: [full_3]

# 2026-06-24: DFS self-consistency fix (see _full25.yaml header). The DFS
# step-decaying mixer (alpha=0.3**step+0.3) + tail-weighted energy loss
# (quadratic weight over the last scf_loss_tail SCF steps, generalized to any
# max_cycles) on every full_X. full_3 scores its last min(3,10)=3 steps; since
# the final step carries weight 1 this is ~unchanged from the prior final-step
# behavior, but converges the SCF for the few species 3 cycles destabilize.
solvers:
  full_3:
    mode: FULL
    max_cycles: 3
    feature_policy: REASSEMBLE
    mixer_name: decaying_linear
    mixer_kwargs: {base: 0.3, floor: 0.3}
    scf_loss_use_tail: true
    scf_loss_tail: 10
    scf_loss_weight_power: 2.0
  # ceiling fix, ready for a follow-up sweep (solver: [full_25]); not swept now.
  full_25:
    mode: FULL
    max_cycles: 25
    feature_policy: REASSEMBLE
    scf_grad_checkpoint: true
    mixer_name: decaying_linear
    mixer_kwargs: {base: 0.3, floor: 0.3}
    scf_loss_use_tail: true
    scf_loss_tail: 10
    scf_loss_weight_power: 2.0

hyperparams:
  n_steps: 500
  lr_start: 0.001
  lr_end: 0.00001
  lr_decay_start: 0.5
  grad_clip: 1.0
  gradnorm_alpha: 1.5
  vxc_weight: 0.01
  density_weight: 0.1
  density_per_electron: true
  pbe_anchor_weight: 0.0
  require_atom_anchors: false
  seed: 42
  # WS2 -- decoupled L2 (adamw). The single most-tunable knob; DFS used 1e-8 on a
  # tiny net, we start firmer since these nets, though 3x16, still overfit r<=26.
  weight_decay: 0.0001
  # WS3 -- held-out validation early-stop + validation-best selection. val_frac
  # of the W4-11+BH76 reactions form the val slice (deterministic); the rest is
  # the reported TEST slice. validate_every/patience in EPOCHS-of-validation.
  val_frac: 0.2
  validate_every: 25
  patience: 5
  early_stop_min_delta: 0.1
  # WS5 -- write a resumable checkpoint every N epochs (atomic resume_* set; a
  # killed task continues from it instead of restarting/failing).
  checkpoint_every: 10

inputs:
  external_refs_dir: /gpfs/scratch/awills/external_refs_dfs_svp_g2
  subset_ledger_path: /gpfs/projects/FernandezGroup/Alec/xcquinox/notebooks/checkpoints_step7/alpha_on/subset_index_log.json
  basis: def2-svp
  grid_level: 2
  density_fit: false
  output_root: /gpfs/scratch/awills/xcquinox_runs/dfs_step7/svp_grid2_v3
  benchmark_refs_dir: /gpfs/scratch/awills/external_refs_bench_svp_g2
  # WS3 -- enabling held-out validation. Gates the per-run val-slice staging
  # (<run_dir>/validation/val_reactions.json); the val density is rebuilt at
  # train time (the SCF precompute was found dead and removed). Required by the
  # submit-time guard whenever validate_every > 0.
  val_refs_dir: /gpfs/scratch/awills/external_refs_val_dfs_svp_g2

pretrain:
  data_dir: /gpfs/scratch/awills/pretrain_data_dfs_svp_g2_allelem
  n_steps: 2500
  lr_start: 0.01
  lr_end: 0.00001
  lr_decay_start: 0.2
  grad_clip: 1.0
  seed: 42
  loss_weighting: integration
  # the 3x16 archs get their OWN 3x16 pretrain checkpoints (one pretrain job per
  # distinct arch); the per-atom Fx/Fc target data is arch-size-independent.
  atoms:
    H: 1
    He: 0
    Li: 1
    C: 2
    N: 3
    O: 2
    F: 1
    Na: 1

cluster:
  partition: ""
  time: "24:00:00"
  cpus_per_task: 24
  array_throttle: 4
  eval_array_throttle: 4
  max_concurrent_tasks: 8
  max_array_size: 1000
  device: cpu
  conda_env: /gpfs/projects/FernandezGroup/Alec/conda_envs/xcquinox
  conda_profile: /gpfs/projects/FernandezGroup/Alec/miniconda3/etc/profile.d/conda.sh
  mail_user: alec.wills@stonybrook.edu
  mail_type: BEGIN,END,FAIL
  account: ""
  preflight_time: "08:00:00"
  eval_time: "02:00:00"
  pretrain_time: "08:00:00"
  benchmark_refs_time: "24:00:00"

domain_profile: dfs_step7

on_precompute_failure: abort
bh76_mode: reaction_energy
ae_as_reactions: true
use_polarized_correlation: true
held_out_strict: true

inline_eval: true
defer_eval: false
