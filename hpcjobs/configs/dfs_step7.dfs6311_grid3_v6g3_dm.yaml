# =============================================================================
# dfs_step7.dfs6311_grid3_v6g3_dm.yaml
# -- CAMPAIGN v6, GROUP G3 (DENSITY-MATRIX DESCRIPTOR):
#    GGA rung, 40core queue scheme,
#    3 architectures x 11 subset sizes = 33 cells.
#
# THE QUESTION: does the density-matrix descriptor earn its place at 3x16 --
# alone, combined with the cusp column, and combined with attention.
#
# ORDER: submission 4 of 5 in the v6 ladder --
#   1. dfs_step7.dfs6311_grid3_v6g1_size.yaml
#        GGA rung, 40core scheme, 4 architectures, 44 cells
#   2. dfs_step7.dfs6311_grid3_v6g2_families.yaml
#        GGA rung, 40core scheme, 6 architectures, 66 cells
#   3. dfs_step7.dfs6311_grid3_v6g2_families_mgga.yaml
#        meta-GGA rung, 96core scheme, 5 architectures, 55 cells
#   4. dfs_step7.dfs6311_grid3_v6g3_dm.yaml
#        GGA rung, 40core scheme, 3 architectures, 33 cells
#   5. dfs_step7.dfs6311_grid3_v6g4_ablations.yaml
#        GGA rung, 40core scheme, 2 architectures, 22 cells
#
# SUBMISSION IS PER GROUP AND INDEPENDENT. Each of the five files is submitted
# on its own and lands in its OWN run directory (`inputs.output_root` below),
# with its own pretraining-data root, its own pretrain array and its own
# fidelity certificate gate. No group waits on another: the order above is the
# order the questions are worth answering in, not a dependency chain, and a
# group that fails its certificate blocks its own train array and nothing else.
# The 220 cells of the five groups are what the campaign submits; the reference
# file dfs_step7.dfs6311_grid3_v6.yaml stays as the statement of the method and
# is not itself submitted.
#
# INHERITED FROM THE REFERENCE FILE, UNCHANGED.
# Every field except the architecture axis, the two roots, the two
# retry-partition keys the 40-core scheme engages and the train wall
# (`cluster.time`: 48 h here against the reference's 72 h -- see the block at
# the key)
# is dfs_step7.dfs6311_grid3_v6.yaml's: the production identity (basis, grid
# level, density fitting, `auxbasis` unset, the calibrated orientation lock,
# the per-rung SCF seed), the pretraining protocol (the DFS set, the pool
# atoms, the per-rung parent density, the spin-channel exchange footing, the
# mesh share, the validation block), the enforced 1.0 kcal/mol / 1.0 mHa
# certificate, the parent anchor and its exact weight-zero objective,
# every hyperparameter, both solver blocks, the subset ledger, the three
# reference-cache roots, every other wall (the eval budget, the pretrain,
# preflight, datagen and benchmark-refs stages, and the 96 h timeout retry)
# and the job mail. The reference file's
# header carries the method and its measured 13-field diff against v5; this
# file states only what it adds.
#
# QUEUE SCHEME: 40core, mirroring dfs_step7.dfs6311_grid3_v4gga.yaml. The
# submit partition is chosen on the command line (`--partition`; the config
# carries none deliberately, so a submission never silently lands on a queue
# that exists on only one login instance), and BOTH retry routes are engaged
# onto the 96-core / ~256 GB Milan nodes. v4gga records the two measured
# risks that routing covers: deep_attn peaked at 142.8 GB RSS, inside a
# 192 GB Skylake node but with modest headroom, and deep_attn r=26 measured
# 42.14 h on 96 Milan cores, which on 40 Skylake cores can exceed the
# queue's wall. The train wall is v4gga's own recorded 40-core figure, 48 h;
# the 96 h timeout retry and every other stage wall are the reference file's,
# sized to the four-channel inline evaluation. cluster.time states what
# becomes of the cells that exceed 48 h.
#
# +-------------------------------------------------------------------------+
# | THIS FILE SUBMITS AS IT SHIPS. model.parent_anchor: true anchors every  |
# | architecture on this axis to its parent (PBE) in the pre-image of the   |
# | networks' bounded map, so each equals its parent at initialization and  |
# | the certificate holds by construction (SPEC_parent_anchor.md).          |
# | pretrain.energy_term_weight: 0.0 is therefore EXACT, not a placeholder: |
# | validate_grid_semantics exempts an anchored run from the weight-zero    |
# | refusal. The energy-weight sweep measured that no weight brings a       |
# | point-wise fit of the parent to the certificate; the anchor removes the |
# | requirement instead of tuning it (spec Section 2).                      |
# +-------------------------------------------------------------------------+
#
# PREREQUISITES, in order:
#   a. pretrain.energy_term_weight needs no measurement: under
#      model.parent_anchor the networks equal the parent at initialization
#      and the certificate holds by construction, so 0.0 (no energy term) is
#      the objective's exact value and is stated, not swept
#      (SPEC_parent_anchor.md Section 3.5; the sweep it supersedes,
#      hpcjobs/probe_pretrain_energy_weight.py, is recorded in Section 2).
#   b. hpcjobs/seed_cache_scan.sbatch is NOT a prerequisite for this group:
#      every architecture on this axis is GGA-rung, `seed_xc: auto` resolves to
#      PBE for all of them, and no task reads inputs.seed_cache_dir.
#   c. pretrain.data_dir is EMPTY or holds THIS GROUP's own files. It is this
#      group's own root, not the reference file's and not another group's:
#      `parent_density: auto` names its files after the parent functional, so
#      two groups sharing a root would collide on the name.
# =============================================================================

sweep:
  # GROUP G3 (DENSITY-MATRIX DESCRIPTOR)'s axis: 3 of the 31 architectures of
  # `xcquinox.alec.ARCHITECTURES`. Listed in the order expand_grid
  # canonicalizes to (`_canon_axis` = sorted(set(...))), so the arch axis reads
  # in array-task order. With 11 subset sizes the grid is 3 x 1 x 1 x
  # 11 x 1 = 33 cells: task index = arch_index * 11 + subset_index, i.e.
  # tasks 0-10 are `deep_combined_3x16`,
  #       11-21 are `deep_combined_attn_3x16`,
  #       22-32 are `deep_dm_3x16`.
  #
  # THE FIVE GROUP AXES ARE PAIRWISE DISJOINT, and together with the eleven
  # architectures the campaign directive excludes from v6 they cover the
  # registry exactly. A NEW ARCHITECTURE ADDED TO THE REGISTRY MAKES THE GROUP
  # SET STALE: the pin `test_v6_groups_and_the_exclusions_partition_the_registry`
  # compares the union against sorted(ARCHITECTURES) and goes red naming the
  # new name, which is the intent -- an architecture may only be left out of
  # the campaign deliberately, in the exclusion list, never by falling through
  # the gap between five files.
  arch:
    - deep_combined_3x16
    - deep_combined_attn_3x16
    - deep_dm_3x16
  loss: [L5_gradnorm_vxc_step7]
  metric: [jsd]
  # v5's subset-size axis, unchanged (v5 line 35). 26 = the dfs_step7 pool
  # size, so the largest cell is the whole training pool.
  subset_size: [1, 2, 3, 4, 5, 6, 7, 12, 15, 18, 26]
  solver: [full_3]

# DFS self-consistency: step-decaying mixer (alpha=0.3**step+0.3) + tail-weighted
# energy loss on full_X. Byte-inherited from v5 (lines 41-61). (The orientation
# lock is NOT set per-solver -- it is a run-level inputs field, authoritative
# for the whole run.)
solvers:
  full_3:
    mode: FULL
    max_cycles: 3
    feature_policy: REASSEMBLE
    mixer_name: decaying_linear
    mixer_kwargs: {base: 0.3, floor: 0.3}
    scf_loss_use_tail: true
    scf_loss_tail: 10
    scf_loss_weight_power: 2.0
  # ceiling fix, defined for a follow-up sweep (solver: [full_25]); not swept now.
  full_25:
    mode: FULL
    max_cycles: 25
    feature_policy: REASSEMBLE
    scf_grad_checkpoint: true
    mixer_name: decaying_linear
    mixer_kwargs: {base: 0.3, floor: 0.3}
    scf_loss_use_tail: true
    scf_loss_tail: 10
    scf_loss_weight_power: 2.0

hyperparams:
  # Byte-inherited from v5 (lines 63-92). 200 epochs: enough for full_3 with
  # the LR schedule (decay starts at 50% = step 100, reaches lr_end by 200),
  # with in-loop validation early-stop as the safety net. NOT 150: the
  # early-stop guard (patience >= n_checks-1, with n_checks = n_steps //
  # validate_every) trips at 150 (6 checks, patience 5); 200 gives 8 checks so
  # patience 5 is non-degenerate and early-stop can fire.
  n_steps: 200
  lr_start: 0.001
  lr_end: 0.00001
  lr_decay_start: 0.5
  grad_clip: 1.0
  gradnorm_alpha: 1.5
  vxc_weight: 0.01
  density_weight: 0.1
  density_per_electron: true
  pbe_anchor_weight: 0.0
  require_atom_anchors: false
  seed: 42
  weight_decay: 0.0001
  val_frac: 0.2
  validate_every: 25
  patience: 5
  early_stop_min_delta: 0.1
  checkpoint_every: 10
  # Shape padding: one common (n_ao, n_grid, naux) target over the whole batch so
  # the de-fused per-molecule kernels collapse to one compile per spin-type instead
  # of one per molecule -- at this basis/grid the per-molecule compile count drove
  # the process mapping count into the vm.max_map_count ceiling. Results-neutral
  # input pass (see xcquinox.alec.padding).
  pad_group_to_common_shape: true

inputs:
  # PRODUCTION IDENTITY, byte-inherited from the reference file (v6 lines
  # 192-204), which value-inherited it from v5. These five fields are exactly
  # what `fidelity.run_identity` records on every certificate, so a change here
  # invalidates every certificate this group writes AND breaks the comparison
  # between groups: the five run directories are one campaign only because
  # their identities are the same object.
  # DFS-paper parity: same basis for training AND the CCSD references, grid 3.
  basis: 6-311++G(3df,2pd)
  grid_level: 3
  # DF makes non-DF-infeasible 6-311++G(3df,2pd) CCSD tractable. As in v5,
  # `auxbasis` is deliberately LEFT UNSET -> auto-selected from the orbital
  # basis; the certificate records the resolved identity's auxbasis as null,
  # matching the run's. DF density ~ exact for density-matching.
  density_fit: true
  # Orientation lock (run-level, authoritative): locks OH/CH/NO reference +
  # training densities to the SAME degenerate component (orientation_lock.py).
  # 3.0e-5 == v5's 0.00003 == orientation_lock.DEFAULT_STRENGTH, the calibrated
  # value. It is also what makes the degenerate free atoms of the pretraining
  # set reproducible at grid level 3 -- see the absence of a waiver below.
  orientation_lock_strength: 3.0e-5
  # NO `allow_irreproducible_degenerate` HERE, DELIBERATELY. The data generator
  # refuses a spatially degenerate free atom's rows only below grid level 3 or
  # with the lock off; at grid 3 with the lock on it refuses nothing, so a
  # stated waiver would grant a permission this run never exercises, and
  # `validate_grid_semantics` REFUSES it outright ("waiver stated without need
  # at grid level 3"). The shipped templates state it because they run at grid
  # level 1; a production copy must drop it, and this one has.
  # Per-rung SCF seeding (v5 protocol): auto = registry-derived rung baseline.
  # Every architecture on THIS axis is GGA-rung, so it resolves to PBE for all
  # 3 of them and no task reads the SCAN cache below. It stays `auto`
  # rather than the literal `pbe` because it is the SAME predicate
  # `pretrain.parent_density: auto` resolves the pretraining density with: one
  # rung statement read by both, so no group file can seed its SCF from one
  # functional while certifying against the other.
  seed_xc: auto
  # Root whose _intermediates/ holds the SCAN seeds. Carried from the reference
  # file and NEVER READ on this axis -- a PBE-seeded architecture consults no
  # cache -- so it is stated only to keep the five groups' `inputs` blocks one
  # identical block. hpcjobs/seed_cache_scan.sbatch is not a prerequisite here.
  seed_cache_dir: /gpfs/scratch/awills/seed_cache_scan_6311ppg3df2pd_g3
  # SAME subsets as v3/v4/v5 and as the other four groups (apples-to-apples
  # across the campaign lineage AND across the ladder).
  subset_ledger_path: /gpfs/projects/FernandezGroup/Alec/xcquinox/notebooks/checkpoints_step7/alpha_on/subset_index_log.json
  # SHARED with v3/v4/v5 and with the other groups (complete, relocked; input
  # data keyed by species/basis/grid, none of which any group moves). Read-only
  # for every group, so sharing them couples nothing.
  external_refs_dir: /gpfs/scratch/awills/external_refs_dfs_6311ppg3df2pd_g3
  benchmark_refs_dir: /gpfs/scratch/awills/external_refs_bench_6311ppg3df2pd_g3
  val_refs_dir: /gpfs/scratch/awills/external_refs_val_6311ppg3df2pd_g3
  # THIS GROUP'S OWN output root: additive, every other run dir -- the other
  # four groups' included -- is untouched, and `status`, `validate_run` and the
  # figure suite each read one group's run at a time.
  output_root: /gpfs/scratch/awills/xcquinox_runs/dfs_step7/dfs6311_grid3_v6g3_dm

pretrain:
  # THIS GROUP'S OWN data_dir. `parent_density: auto` names its files after the
  # parent functional, and on this axis it resolves to PBE for every
  # architecture, so exactly ONE file is built here. A root shared between
  # groups would collide on that name and, worse, be a write race the moment
  # two groups' datagen jobs overlap -- which they may, because the groups are
  # independent submissions with no ordering between them. The per-group copies
  # are value-identical by construction: the rows are a deterministic function
  # of the set, the footing, the objective and the run identity, all five of
  # which are the same in all five files.
  data_dir: /gpfs/scratch/awills/pretrain_data_dfs_6311ppg3df2pd_g3_v6g3_dm
  # Pretraining schedule, byte-inherited from v5 (lines 134-140).
  n_steps: 2500
  lr_start: 0.01
  lr_end: 0.00001
  lr_decay_start: 0.2
  grad_clip: 1.0
  seed: 42
  loss_weighting: integration
  # Explicit atoms, inherited from v5 (lines 141-152). Under `dfs_set` +
  # `pool_atoms` this list is almost entirely redundant -- H, C, N, O, F are
  # pool atoms and Li is one of the DFS inventory's eight -- and contributes
  # exactly ONE system the two inventories do not supply: the Na atom. It is
  # kept for that one row: Na2 is in the DFS molecular inventory AND in this
  # campaign's training pool, and its atomization energy rests on a free-Na
  # row that neither BH76 nor W4-11 provides. Measured composition at this
  # setting: 30 DFS systems + 7 new pool atoms + Na = 38 systems on the PBE
  # parent, 36 on the SCAN parent (whose DFS variant drops H2 and N2).
  # NOTE: He is absent and must stay absent -- PySCF has no He in
  # 6-311++G(3df,2pd) (BasisNotFoundError); every other element of the v6 set
  # (Al B Be C Cl F H Li N Na O P S Si) was checked present at this basis.
  atoms:
    H: 1
    Li: 1
    C: 2
    N: 3
    O: 2
    F: 1
    Na: 1
  # --- pretraining protocol (spec Sections 3.2, 6 and 7) -------------------
  # The block v6 exists to turn on, stated in full in every group file so each
  # one is a complete statement of the protocol it runs rather than a pointer
  # to a file it is not submitted with.
  #
  # The SET (Section 7: "the DFS pretraining set in its entirety, plus every
  # atom of the BH76 / W4-11 pools"). dfs_set adds the DFS inventory -- 8 free
  # atoms + 22 G2/97 molecules at the GGA level, 20 molecules at the meta-GGA
  # level, which drops H2 and N2; pool_atoms adds all 14 single-atom species of
  # the merged BH76 / W4-11 pools at their production charges and spins (the 12
  # neutral elements plus the F- and Cl- anions that are BH76 reactants). Both
  # replace the historical four-atom default; the `atoms` list above extends it
  # by Na. The set is the same in all five groups: a certificate is only
  # comparable across groups if the networks were fitted to the same rows.
  dfs_set: true
  pool_atoms: true
  # The DENSITY the targets sit on. "auto" = each architecture's rung baseline
  # (Section 1: "PBE for GGA-rung architectures, SCAN for meta-GGA
  # architectures"), resolved through `ArchitectureConfig.is_meta_gga` -- the
  # one rung predicate `inputs.seed_xc: auto`, the datagen stage's required-file
  # derivation and the pretraining targets all read, so a meta-GGA architecture
  # cannot be fitted against one parent while its SCF is seeded from the other.
  # Over THIS axis it resolves to PBE for every architecture, so the
  # datagen stage builds ONE file (38 systems) and the wall below
  # covers a single reference-SCF pass over the set; the mixed-rung, two-file
  # case is the reference file's, not this group's.
  parent_density: auto
  # The open-shell exchange FOOTING, the correction of defect D1/D2. Each spin
  # channel's rows are posed at (2 rho_sigma, 4 sigma_sigma, features of the
  # symmetric doubled density diag(P_sigma, P_sigma)) -- the Oliver-Perdew
  # spin scaling (Phys. Rev. A 20, 397 (1979)) that the production UKS exchange
  # actually evaluates. "total", the pre-protocol value every run through v5
  # used, fitted spin-resolved targets against total-density inputs.
  exchange_footing: spin_channel
  # The synthetic (r_s, s, alpha) mesh's share of the total integration weight,
  # kept as a REGULARIZER only (Section 6, deviation 1). 0.3 is the anchored
  # default: `pretrain_data_gen.MESH_WEIGHT_FRACTION = 0.3` (line 1006), the
  # share whose efficacy was measured when the mesh shipped. Stated, not
  # inherited.
  mesh_fraction: 0.3
  # =========================================================================
  # THE OBJECTIVE under the parent anchor.
  #
  # `energy_term_weight` weights the per-system energy term
  # mean_s (E_xc^NN_s - E_xc^parent_s)^2, in inverse Hartree^2, beside the
  # point-wise enhancement-factor residual. With model.parent_anchor: true
  # every network on this axis EQUALS its parent at initialization
  # (SPEC_parent_anchor.md Sections 3.2 and 3.5): both terms of the
  # objective are zero to round-off before the first step, the certificate
  # passes at initialization, and a pretrain from there converges where it
  # starts. The weight is therefore no longer the value that decides whether
  # the certificate can be met, and 0.0 -- the point-wise objective alone,
  # the energy term not evaluated (`pretrain.py` short-circuits on
  # `energy_weight == 0.0`) -- is the exact statement of this run's
  # objective, not a placeholder.
  #
  # `validate_grid_semantics` still refuses the combination `dfs_set: true`
  # + `fidelity.enforce: true` + `energy_term_weight: 0.0` for an UNANCHORED
  # run, where that objective was measured unable to deliver the parent
  # (SPEC_pretrain_fidelity_program.md Section 2, 2.3 to 56.1 kcal/mol of
  # atomization offset), and the energy-weight sweep of
  # hpcjobs/probe_pretrain_energy_weight.py then measured that no weight
  # closes the gap either (SPEC_parent_anchor.md Section 2). An anchored run
  # is exempt from that refusal by construction.
  # =========================================================================
  energy_term_weight: 0.0
  # VALIDATION and the stop criterion, at the spec Section 7 / Task 7 defaults
  # (the "v6:" values the shipped templates carry beside their own
  # pre-protocol settings, cluster/examples/grid_step7.yaml). A seeded 20% of
  # the MULTI-NUCLEUS systems is withheld and scored every 50 steps; training
  # stops after 10 validations with no improvement and keeps the best weights,
  # replacing the DFS protocol's hand interruption (Section 6, deviation 3).
  # n_steps 2500 / validate_every 50 = 50 checks, so patience 10 is far from
  # the degenerate regime.
  validation_fraction: 0.2
  validation_seed: 0
  validate_every: 50
  patience: 10

cluster:
  partition: ""
  # 48 h, the recorded long-40core cap: `inline_eval: true` runs the eval
  # INSIDE the train task, so this one wall has to hold both, and v6's eval
  # is four channels where v3's was three. The arithmetic below puts the
  # large-subset attention cells above this wall deliberately; what happens
  # to them is under QUEUE ADMISSIBILITY.
  #
  # THE ARITHMETIC, from v3's own measurement at this exact basis, grid and
  # solver: deep_attn_3x16 at subset 26 took 42.14 h (attention is 2.3-2.9x
  # its non-attention twin), under a THREE-channel inline eval --
  # hpcjobs/configs/dfs_step7.dfs6311_grid3_v3.yaml states inline_eval: true,
  # eval_time: "02:00:00" and no eval_coldstart. v6 runs FOUR channels, one
  # of them the 25-cycle coldstart diagnostic, budgeted at 08:00:00 below.
  # The same cell is then
  #     42.14 - 2 + 8 = 48.1 h   if the 42.14 h already contained a 2 h eval
  #     42.14     + 8 = 50.1 h   if it was train time alone
  # and both exceed 48 h, so this wall DOES wall-kill the large-subset
  # attention cells; 50.1 h is the reading to plan against, and the 40-core
  # class admits no wall above 48 h. Those cells are recovered rather than
  # prevented -- see QUEUE ADMISSIBILITY below.
  # This group's one attention cell is `deep_combined_attn_3x16`, the
  # measured shape with four descriptor columns added.
  # The corrected potential also adds a feature-response derivative per SCF
  # cycle, so no cell is faster than v3's.
  #
  # QUEUE ADMISSIBILITY: VERIFY WITH sinfo BEFORE THE FIRST SUBMISSION.
  # SEAWULF_RUNBOOK.md records the max walls as short-* 4 h, medium-* 12 h,
  # long-28core 2 days and long-96core-shared "longer still"; v4gga records
  # long-40core at 48 h. Check the queue this group is submitted to with
  #     sinfo -o "%20P %10l" -p long-40core
  # This file SHIPS the recorded long-40core figure, 48 h -- the value the
  # v4gga campaign ran at on this queue -- because an over-cap --time is
  # rejected at submit, and 72 h would refuse every task if 48 h is the cap.
  # The ~50.1 h large-subset attention cells therefore wall-kill BY DESIGN
  # and are RESUBMITTED FROM THEIR CHECKPOINT (checkpoint_every: 10 above)
  # into a second window of this SAME wall on this SAME partition, in the
  # SAME run directory:
  #     python -m xcquinox.alec.cluster resubmit <run_dir> --submit
  # Each killed cell picks up where it stopped, so ~50 h of work completes
  # across two 48 h windows. The resume checkpoint outranks the wall-kill
  # record in the classifier, which is why a checkpointed cell is CONTINUED
  # and does NOT draw the retry keys below; those cover the other case, a
  # cell killed before its first checkpoint, which restarts from step zero
  # and is escalated onto the 96-core class at 96 h where a whole run fits in
  # one window. `cluster status <run_dir>` reports which case each index is
  # in and names the same command. The recovery is operator-driven: no
  # --requeue is rendered and nothing resubmits unattended.
  # If sinfo shows a cap of 72 h or more, `--train-time 72:00:00` at submit
  # sizes the train array to the larger reading up front and avoids the
  # wall-kill entirely -- `--train-time`, NOT the base `--time`, which raises
  # EVERY stage's wall including the 12 h pretrain and preflight jobs.
  #
  # Peak measured RSS is 142.8 GB: a 192 GB Skylake node holds it with modest
  # headroom, and an OOM routes onto the 256 GB Milan nodes (see the retry keys
  # below). Never a 128 GB node.
  time: "48:00:00"
  cpus_per_task: 24
  array_throttle: 4
  eval_array_throttle: 4
  max_concurrent_tasks: 8
  max_array_size: 1000
  device: cpu
  # RETRY ESCALATES TO THE LARGER NODE CLASS: both keys carry v4gga's values
  # because this group submits on the 40-core queue and the 96-core Milan nodes
  # are the bigger box to fall back to; the meta-GGA group leaves both unset
  # because it already submits on that largest class, where a re-route buys
  # nothing.
  # OOM auto-retry, ENGAGED, as in v4gga (which the 40-core scheme is taken
  # from): CPU XLA/LLVM *compile* OOMs classify as "oom" rather than
  # "deterministic" (HISTORY Phase 15), so an OOM'd cell resubmits onto the
  # larger-per-node-memory 96-core Milan nodes (~256 GB, against the 40-core
  # queue's 192 GB) and restarts there from step zero. An OOM'd cell that had
  # already written a resume checkpoint is CONTINUED from it instead, at this
  # file's own resources -- the checkpoint outranks the failure record, so the
  # bigger node and the resume are alternatives, never one relaunch.
  # The partition must exist
  # on the login instance the submission is made from or the retry sbatch is
  # rejected -- verify the spelling with the sinfo call above. The v4gga
  # value `long-96core` inherited here was retargeted 2026-08-30:
  # long-96-core-qos caps MaxWall at 48 h (sacctmgr, 2026-08-27), so the
  # 96 h escalation below was rejected exactly when it fired; extended-96core
  # carries the 7-day cap that admits it.
  oom_retry_partition: extended-96core
  # TIMEOUT retry keys, ENGAGED, and on the 40-core scheme they carry a
  # PARTITION as well as a wall. They apply to ONE case: a cell wall-killed
  # before it wrote its first resume checkpoint. That cell restarts from step
  # zero, so `cluster resubmit` relaunches it on the larger, longer-wall queue
  # where a full run fits in one window. A cell that DID checkpoint is
  # continued at this file's own partition and wall instead (see the wall
  # block above); the two are exclusive and the checkpoint wins. Without these
  # keys the second case would restart from zero on a wall it has already been
  # shown to exceed. Both cases are the same operator command; neither is
  # unattended. The 96 h below sits inside extended-96core's 7-day QOS cap
  # (sacctmgr, 2026-08-27; the earlier long-96core target capped MaxWall at
  # 48 h and rejected this escalation at recovery time) -- the rendered-wall
  # test in test_cluster_examples.py holds every retry wall inside its
  # target's cap.
  timeout_retry_partition: extended-96core
  timeout_retry_time: "96:00:00"
  # jax-0.7.0 PARITY env (matches the local dev/test stack the meta-GGA code was
  # tested on) -- a fresh, single-purpose conda-forge+pip env built from
  # environment-cluster-parity.yml. NOT the old polluted xcquinox env (jax 0.4.35).
  conda_env: /gpfs/projects/FernandezGroup/Alec/conda_envs/xcquinox_j070
  conda_profile: /gpfs/projects/FernandezGroup/Alec/miniconda3/etc/profile.d/conda.sh
  mail_user: alec.wills@stonybrook.edu
  mail_type: BEGIN,END,FAIL
  account: ""
  preflight_time: "12:00:00"
  # Compile-smoke gate: the preflight compiles the heaviest attention cell once
  # (n_steps=1) on its exclusive node before the 33-task array; a
  # host-OOM there blocks the array via the afterok dep -- one cheap failure
  # instead of 33. The selector orders the attention cells by subset
  # size, then depth x width, then descriptor feature columns, then name
  # (`_preflight._select_smoke_cell`), so the choice reads only the cells' own
  # properties. On this axis that is
  # `deep_combined_attn_3x16` at subset 26, this group's only
  # attention architecture.
  # The same preflight also sweeps every swept architecture's certificate with
  # no exemption, which is the second thing that fails cheap.
  preflight_compile_smoke: true
  # 4 channels now, one of them 25-cycle (the coldstart diagnostic
  # runs all 25 cycles for every species): ~4x the 3-channel budget.
  # NOT REQUESTED under `inline_eval: true` -- no eval array is submitted, so
  # no job carries this wall; the eval runs inside the train task under
  # `time` above. It is the eval BUDGET the train wall's arithmetic uses, and
  # it is carried here so v5-vs-v6 reads the same key. Read it as an input to
  # that derivation, never as headroom the train task has on its own.
  eval_time: "08:00:00"
  # 12 h covers pretraining AND the fidelity certificate, which now runs on
  # this node after the networks are written. Measured anchors: the
  # certificate is ~39 systems (the pools' free atoms, the DFS pretraining
  # molecules, H2O / N2 / CH4), each a reference SCF at the run's identity plus
  # the network and parent XC evaluations -- 39 systems in 32 s at sto-3g /
  # grid level 1, against a per-species precompute wall of 0.6 s (Li) to 5.2 s
  # (CH4) at THIS identity and several times that for the set's largest
  # molecules, so of order tens of minutes here. Pretraining itself is 2500
  # full-batch steps whose per-step cost is milliseconds now that the loop is
  # jitted once rather than per snapshot interval. The margin is the point:
  # the train array is gated afterok on this job.
  pretrain_time: "12:00:00"
  # STATED here although v5 left it unset (v5 had 3 distinct architectures).
  # Unset means every distinct architecture pretrains concurrently, i.e.
  # 3 whole exclusive nodes at once for this group alone, with the
  # other groups possibly queued beside it. 4 is the reference file's value,
  # kept identical in all five so the five pretrain arrays are one etiquette
  # budget. The wall above is per task, so throttling costs queue time and
  # nothing else.
  # With fewer than four architectures on this axis the throttle is not
  # binding for this group on its own.
  pretrain_throttle: 4
  # Datagen builds this group's pretrain-data file and every later stage of
  # this group waits on it. v5 had no key here and inherited pretrain_time;
  # v6's datagen is a different job. At this identity the measured per-species
  # precompute wall is 0.7 s for H, 0.6 s Li, 1.1 s O, 1.4 s C, 2.0 s N, 3.4 s
  # H2O (32136 grid points), 3.5 s N2 (26616) and 5.2 s CH4 (49408). The v6
  # set's largest molecules -- C3H8 (11 nuclei), C4H6 (10), SiCH6 (8), AlCl3
  # (4 heavy nuclei at a 3df basis), Si2 -- carry several times those grids and
  # basis sets. This group builds ONE file, on PBE
  # densities, so the wall covers a single reference-SCF pass over the
  # set rather than the reference file's two.
  # Four hours is roughly an order of magnitude of margin on the one job the
  # rest of this group's graph waits for.
  datagen_time: "04:00:00"
  # The 214-species held-out CCSD at 6-311++G(3df,2pd) (even DF) is slow for the
  # big species; the job is skip-if-complete + resumable, so it grinds through
  # across requeues. With the refs dirs shared and complete from v3-v5, this
  # stage should reduce to a skip-if-current verification pass -- for the first
  # group submitted and, a fortiori, for the four after it.
  benchmark_refs_time: "24:00:00"

domain_profile: dfs_step7

on_precompute_failure: abort
bh76_mode: reaction_energy
ae_as_reactions: true
use_polarized_correlation: true
held_out_strict: true

inline_eval: true
eval_coldstart: true
defer_eval: false

# --- the model class (SPEC_parent_anchor.md) --------------------------------
# parent_anchor: every architecture on this axis is anchored to its parent
# functional, PBE on this GGA-rung axis, in the pre-image of the networks'
# bounded map,
# F = 1 + L(z_parent + gated) with z_parent the point where the map returns
# the parent, so the model equals its parent at initialization pointwise and
# the certificate holds by construction. Requires use_polarized_correlation:
# true (above): the parent's correlation is divided by the model's
# zeta-dependent PW92 baseline. Recorded in the manifest, the pretrain
# metadata and every certificate; a checkpoint written under the other
# anchor state is refused by the loaders.
# descriptor_coordinates: the DFS coordinate set of PRB 104 L161109 -- the
# correlation MLP reads x0 = ln(n^(1/3) + 1e-5), x1 = ln(spinscale) and x_s,
# the exchange MLP x_s alone, the meta-GGA nets x_alpha = ln((alpha + 1)/2)
# -- as networks.py states them, line by line of the vendored dpyscfl source.
# A new checkpoint family; "legacy" is the layout every run through v5 used.
model:
  parent_anchor: true
  descriptor_coordinates: dfs

# --- pretraining-fidelity certificate (spec Sections 3.3 and 7) ------------
# ENFORCED at the program's binding tolerances. PASS requires
#   max |dE_xc| over the free atoms          <= tol_atom = 1.0 mHa
#   max |dAE|   over the atomization energies <= tol_AE   = 1.0 kcal/mol
# measured through the production energy path on the parent's own
# self-consistent density at this run's identity, plus the O1-O4 oracles.
#
# `override_reason` is null and MUST STAY null: at these tolerances none is
# needed (a reason is required only above the 2.0 / 2.0 ceiling, or to set
# `enforce: false`), and a reason written here would be copied into every
# certificate this run writes. `enforce: true` means the pretrain task exits
# non-zero on a FAIL and this group's train array never releases -- this
# group's only, which is what makes the five gates independent.
fidelity:
  tol_AE: 1.0               # kcal/mol
  tol_atom: 1.0             # mHa
  override_reason: null
  enforce: true
