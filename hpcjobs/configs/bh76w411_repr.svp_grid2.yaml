# =============================================================================
# bh76w411_repr.svp_grid2.yaml -- train the 8-arch ablation set on the BH76+W4-11
# JSD representative subsets (r=1..6). Submission A: def2-svp + grid_level 2, NO
# density fitting.
# =============================================================================
# Pool = the full BH76+W4-11 reaction set (domain_profile: bh76w411_step7); each
# (arch, subset_size) cell trains on the alpha_on JSD-representative subset of
# that size and is evaluated on the COMPLEMENT (held_out_strict: true). The
# preflight generates CCSD reference densities ONLY for the training-subset
# species (ledger-scoped), so it stays small. Descriptors (cusp/dm) are computed
# per-arch at train time. Same arch/loss/solver setup as the ablation runs.
# 8 archs x 1 metric (jsd) x 1 solver x 6 subset_sizes = 48 specs (inline-eval).
# =============================================================================

sweep:
  arch:
    - deep
    - deep_attn
    - deep_dm
    - deep_cusp
    - deep_combined
    - deep_combined_attn
    - deep_notransform
    - deep_notransform_attn
  loss: [L5_gradnorm_vxc_step7]
  metric: [jsd]
  subset_size: [1, 2, 3, 4, 5, 6]
  solver: [full_3]

solvers:
  full_3:
    mode: FULL
    max_cycles: 3
    feature_policy: REASSEMBLE

hyperparams:
  n_steps: 250
  lr_start: 0.01
  lr_end: 0.00001
  lr_decay_start: 0.2
  grad_clip: 1.0
  gradnorm_alpha: 1.5
  vxc_weight: 0.01
  density_weight: 0.1
  pbe_anchor_weight: 0.0
  require_atom_anchors: false
  seed: 42

inputs:
  external_refs_dir: /gpfs/scratch/awills/external_refs_bh76w411_svp
  subset_ledger_path: /gpfs/projects/FernandezGroup/Alec/xcquinox/hpcjobs/ledgers/bh76w411_repr_alpha_on_r1-6.json
  basis: def2-svp
  grid_level: 2
  density_fit: false
  output_root: /gpfs/scratch/awills/xcquinox_runs/bh76w411_repr/svp_grid2
  # campaign ran unlocked; stated so the harness default (3e-5) cannot change it
  orientation_lock_strength: 0.0

pretrain:
  data_dir: /gpfs/scratch/awills/pretrain_data_bh76w411_svp_g2
  n_steps: 2500
  lr_start: 0.01
  lr_end: 0.00001
  lr_decay_start: 0.2
  grad_clip: 1.0
  seed: 42
  loss_weighting: integration

cluster:
  partition: ""
  time: "08:00:00"
  cpus_per_task: 24
  array_throttle: 4
  eval_array_throttle: 4
  max_concurrent_tasks: 8
  max_array_size: 1000
  device: cpu
  conda_env: /gpfs/projects/FernandezGroup/Alec/conda_envs/xcquinox
  conda_profile: /gpfs/projects/FernandezGroup/Alec/miniconda3/etc/profile.d/conda.sh
  mail_user: alec.wills@stonybrook.edu
  mail_type: BEGIN,END,FAIL
  account: ""
  preflight_time: "08:00:00"
  eval_time: "02:00:00"
  pretrain_time: "08:00:00"

domain_profile: bh76w411_step7

on_precompute_failure: abort
bh76_mode: reaction_energy
use_polarized_correlation: true
held_out_strict: true

inline_eval: true
defer_eval: false
